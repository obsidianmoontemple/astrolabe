<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fatal Grace — Divination Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0c0910;
    --void-2:#151019;
    --wine:#5c1a2b;
    --wine-deep:#3a0f1c;
    --veil:#352243;
    --gold:#b8923f;
    --gold-bright:#e0b859;
    --parchment:#e8dcc4;
    --bone:#b9ae9c;
    --blood:#7a2436;
    --ok:#7c9473;
    --shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse at 50% 0%, #241a2c 0%, var(--void) 55%, #060409 100%);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  #embers{position:fixed; inset:0; z-index:0; pointer-events:none;}
  #app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;}

  h1,h2,h3,.display{font-family:'Cinzel', serif; letter-spacing:0.04em;}
  .deco{font-family:'Cinzel Decorative', serif;}

  ::selection{background:var(--wine); color:var(--gold-bright);}
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--void);}
  ::-webkit-scrollbar-thumb{background:var(--wine); border-radius:6px;}

  a, button{font-family:inherit; cursor:pointer;}
  button{background:none; border:none; color:inherit;}
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--gold-bright); outline-offset:3px;
  }

  /* ---------- Top nav ---------- */
  #topnav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; position:sticky; top:0; z-index:50;
    background:linear-gradient(to bottom, rgba(12,9,16,0.95), rgba(12,9,16,0));
    backdrop-filter:blur(4px);
  }
  #topnav .brand{
    font-family:'Cinzel Decorative'; font-size:1.05rem; color:var(--gold-bright);
    letter-spacing:0.12em; text-transform:uppercase; display:flex; gap:10px; align-items:center;
  }
  #topnav .brand svg{width:22px; height:22px;}
  #navlinks{display:flex; gap:6px; flex-wrap:wrap;}
  #navlinks button{
    font-family:'Cinzel'; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase;
    padding:8px 14px; border:1px solid rgba(184,146,63,0.35); border-radius:2px;
    color:var(--bone); transition:all .25s ease; background:rgba(255,255,255,0.02);
  }
  #navlinks button:hover{border-color:var(--gold-bright); color:var(--gold-bright);}
  #navlinks button.active{background:var(--wine-deep); border-color:var(--gold); color:var(--gold-bright);}

  section.view{display:none; flex:1; padding:20px 28px 80px; animation:fadeIn .5s ease;}
  section.view.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .eyebrow{
    font-family:'Cinzel'; font-size:0.7rem; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--gold); margin-bottom:8px; display:block;
  }
  .rule{height:1px; background:linear-gradient(to right, transparent, var(--gold) 20%, var(--gold) 80%, transparent); margin:22px 0; opacity:0.5;}

  /* ---------- Shared station chrome ---------- */
  .stationHead{max-width:900px; margin:0 auto 26px; text-align:center;}
  .stationHead h2{font-size:clamp(1.6rem,4vw,2.4rem); color:var(--gold-bright); font-weight:700;}
  .stationHead p{color:var(--bone); font-style:italic; margin-top:6px;}
  .controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:18px 0 8px;}
  .btn{
    font-family:'Cinzel'; font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase;
    padding:11px 22px; border:1px solid var(--gold); border-radius:2px; color:var(--gold-bright);
    background:linear-gradient(180deg, rgba(184,146,63,0.12), rgba(92,26,43,0.18));
    transition:all .25s ease;
  }
  .btn:hover{background:var(--wine-deep); box-shadow:0 0 18px rgba(184,146,63,0.25);}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .btn.ghost{background:transparent; border-color:rgba(184,146,63,0.4); color:var(--bone);}
  .pillgroup{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .pill{
    padding:7px 14px; border-radius:20px; border:1px solid rgba(184,146,63,0.35); font-size:0.82rem;
    color:var(--bone); background:rgba(255,255,255,0.02); transition:all .2s ease;
  }
  .pill.on{background:var(--wine-deep); border-color:var(--gold); color:var(--gold-bright);}

  /* ---------- Landing ---------- */
  .door{
    border:1px solid rgba(184,146,63,0.3); border-radius:4px; padding:22px;
    background:linear-gradient(160deg, rgba(53,34,67,0.35), rgba(12,9,16,0.4));
    transition:transform .25s ease, border-color .25s ease; cursor:pointer;
  }
  .door:hover{transform:translateY(-4px); border-color:var(--gold-bright);}
  .door h3{color:var(--gold-bright); font-size:1.05rem; margin-bottom:6px;}
  .door p{color:var(--bone); font-size:0.92rem; line-height:1.5;}
  .door .doorGlyph{font-size:1.6rem; margin-bottom:10px; display:block;}

  /* ---------- Tarot cards ---------- */
  .spreadGrid{display:flex; gap:20px; justify-content:center; flex-wrap:wrap; margin:34px auto; max-width:1100px;}
  .cardSlot{display:flex; flex-direction:column; align-items:center; gap:10px; width:160px;}
  .cardSlot .slotLabel{font-family:'Cinzel'; font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); text-align:center;}
  .card3d{width:150px; height:250px; perspective:1000px;}
  .cardInner{position:relative; width:100%; height:100%; transition:transform .7s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d;}
  .cardInner.flipped{transform:rotateY(180deg);}
  .cardFace{position:absolute; inset:0; backface-visibility:hidden; border-radius:8px; overflow:hidden; box-shadow:var(--shadow);}
  .cardBack{
    background: repeating-linear-gradient(45deg, var(--wine-deep) 0 10px, #2a0d17 10px 20px);
    border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;
  }
  .cardBack svg{width:60%; opacity:0.8;}
  .cardFront{
    background:linear-gradient(160deg, #1c1420, #100b14);
    border:2px solid var(--gold-bright); transform:rotateY(180deg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:12px; text-align:center;
  }
  .cardFront.reversed{transform:rotateY(180deg) rotate(180deg);}
  .cardFront .arcSym{font-size:1.8rem; margin-bottom:8px;}
  .cardFront .cName{font-family:'Cinzel'; font-size:0.82rem; color:var(--gold-bright); font-weight:600; line-height:1.3;}
  .cardFront .cTag{font-size:0.68rem; color:var(--bone); text-transform:uppercase; letter-spacing:0.08em; margin-top:4px;}

  /* ---------- Reading Text & Synthesis Cards ---------- */
  .synthesis{
    max-width:820px; margin:0 auto 22px; padding:22px 26px; border-radius:6px;
    background:linear-gradient(160deg, rgba(184,146,63,0.12), rgba(92,26,43,0.18));
    border:1px solid var(--gold); box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .synthesis .synTitle{font-family:'Cinzel'; font-size:0.85rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold-bright); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .synthesis p{color:var(--parchment); line-height:1.65; font-size:1.02rem;}

  .readingText{max-width:820px; margin:10px auto 0; display:none; flex-direction:column; gap:16px;}
  .readingText.show{display:flex; animation:fadeIn .5s ease;}
  .readCard{background:rgba(255,255,255,0.025); border:1px solid rgba(184,146,63,0.25); border-left:3px solid var(--gold); border-radius:4px; padding:18px 22px;}
  .readCard h4{color:var(--gold-bright); font-family:'Cinzel'; font-size:0.95rem; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;}
  .readCard .positionSub{font-family:'EB Garamond'; font-style:italic; font-size:0.85rem; color:var(--bone); font-weight:normal;}
  .readCard .meaning{color:var(--parchment); line-height:1.6; font-size:0.98rem;}

  /* ---------- Runes ---------- */
  .runeGrid{display:flex; gap:22px; justify-content:center; flex-wrap:wrap; margin:34px auto;}
  .runeTile{width:110px; height:110px; border-radius:6px; background:linear-gradient(160deg,#2a1f10,#150f08); border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:2.6rem; color:var(--gold-bright); box-shadow:var(--shadow); transition:transform .4s ease;}
  .runeTile.reversed{transform:rotate(180deg);}
  .runeCaption{text-align:center; margin-top:8px; font-family:'Cinzel'; font-size:0.78rem; color:var(--bone); letter-spacing:0.05em;}

  /* ---------- Material selectors ---------- */
  .matSwatch{width:34px; height:34px; border-radius:50%; border:2px solid transparent; cursor:pointer; display:inline-block; box-shadow:inset 0 0 6px rgba(0,0,0,0.5);}
  .matSwatch.on{border-color:var(--gold-bright); box-shadow:0 0 10px rgba(224,184,89,0.5);}
  .matRow{display:flex; gap:18px; justify-content:center; align-items:center; flex-wrap:wrap; margin:10px 0 4px;}
  .matRow label{display:flex; flex-direction:column; align-items:center; gap:6px; font-family:'Cinzel'; font-size:0.62rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--bone);}

  .mat-wood{background:repeating-linear-gradient(100deg,#6b4726 0 3px,#4a2f19 3px 7px);}
  .mat-bone{background:radial-gradient(circle at 35% 30%, #f2e8cf, #cabb8f 75%);}
  .mat-stone{background:radial-gradient(circle at 35% 30%, #7a7a7a, #2c2c2c 80%);}
  .mat-crystal{background:radial-gradient(circle at 35% 30%, #cdb3f2, #4a2f75 85%); box-shadow:0 0 12px rgba(180,140,255,0.5), inset 0 0 6px rgba(0,0,0,0.4);}
  .mat-metal{background:linear-gradient(135deg,#e6d29a,#8a6a2c 55%,#3a2a10);}

  .runeTile.mat-wood{background:repeating-linear-gradient(100deg,#6b4726 0 3px,#4a2f19 3px 7px); border-color:#8a5a2c; color:#f0dcae;}
  .runeTile.mat-bone{background:radial-gradient(circle at 35% 30%, #f2e8cf, #b9a877 85%); border-color:#a89b76; color:#3a2f1f;}
  .runeTile.mat-stone{background:radial-gradient(circle at 35% 30%, #6c6c6c, #232323 85%); border-color:#7a7a7a; color:#e4e4e4;}
  .runeTile.mat-crystal{background:radial-gradient(circle at 35% 30%, #a884d6, #2a1f45 88%); border-color:#a98be0; color:#eee0ff; box-shadow:0 0 18px rgba(168,132,214,0.45), var(--shadow);}
  .runeTile.mat-metal{background:linear-gradient(135deg,#e6d29a,#8a6a2c 55%,#2a1d09); border-color:#c9a86a; color:#2a1d09;}

  /* ---------- Lithomancy ---------- */
  #lithoStage{position:relative; width:min(480px,90vw); height:min(480px,90vw); margin:24px auto;}
  #lithoStage svg{position:absolute; inset:0;}
  .stone{
    position:absolute; width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #8a7a63, #3a3226 70%);
    box-shadow:0 4px 10px rgba(0,0,0,0.6), inset 0 0 4px rgba(0,0,0,0.5);
    transform:translate(-50%,-50%) scale(0); transition:transform .6s cubic-bezier(.34,1.56,.64,1);
  }
  .stone.dropped{transform:translate(-50%,-50%) scale(1);}
  .stone.mat-riverstone{background:radial-gradient(circle at 32% 30%, #8a7a63, #3a3226 70%);}
  .stone.mat-crystal{background:radial-gradient(circle at 32% 30%, #cdb3f2, #4a2f75 80%); box-shadow:0 0 12px rgba(180,140,255,0.55);}
  .stone.mat-obsidian{background:radial-gradient(circle at 30% 25%, #4a4a52, #060608 75%); box-shadow:0 0 8px rgba(255,255,255,0.15), 0 4px 10px rgba(0,0,0,0.7);}
  .bonePiece{position:absolute; width:34px; height:17px; transform:translate(-50%,-50%) scale(0); transition:transform .6s cubic-bezier(.34,1.56,.64,1);}
  .bonePiece.dropped{transform:translate(-50%,-50%) scale(1) rotate(var(--rot,0deg));}

  .rayLegend{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; max-width:820px; margin:20px auto;}
  .rayLegend .rayItem{font-size:0.82rem; color:var(--bone); border-left:2px solid var(--gold); padding:4px 10px;}
  .rayLegend .rayItem b{color:var(--gold-bright); font-family:'Cinzel'; font-size:0.72rem; letter-spacing:0.06em;}

  /* ---------- Journal ---------- */
  .journalList{max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:16px;}
  .journalItem{
    border:1px solid rgba(184,146,63,0.25); border-radius:6px; padding:18px 22px;
    background:rgba(255,255,255,0.02); transition:all .2s ease; position:relative;
  }
  .journalItem:hover{border-color:rgba(184,146,63,0.5); background:rgba(255,255,255,0.035);}
  .journalItem .jHeader{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .journalItem .jMeta{font-family:'Cinzel'; font-size:0.72rem; color:var(--gold); letter-spacing:0.08em; text-transform:uppercase;}
  .journalItem .jTitle{font-family:'Cinzel'; font-size:1.05rem; color:var(--gold-bright); font-weight:600;}
  .journalItem .jBody{color:var(--parchment); font-size:0.95rem; line-height:1.6; margin-top:10px; border-top:1px solid rgba(184,146,63,0.15); padding-top:10px;}
  .journalItem .jSynth{font-style:italic; color:var(--bone); margin-top:8px; font-size:0.9rem; background:rgba(92,26,43,0.15); padding:8px 12px; border-radius:4px;}
  .journalEmpty{text-align:center; color:var(--bone); font-style:italic; margin-top:40px; font-size:1.05rem;}
  .noteBox{max-width:820px; margin:24px auto 0; font-size:0.88rem; color:var(--bone); text-align:center; border-top:1px solid rgba(184,146,63,0.2); padding-top:16px; line-height:1.5;}

  .cardArt{width:64px; height:64px; margin-bottom:6px;}
  .cardArt svg{width:100%; height:100%;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block !important; position:absolute; top:0; left:0; width:100%; padding:30px; background:#fff; color:#111;}
    #printArea h2{font-family:Georgia,serif; font-size:22px; margin-bottom:4px;}
    #printArea .pMeta{font-size:12px; color:#555; margin-bottom:16px;}
    #printArea .pEntry{margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #ccc;}
    #printArea .pEntry b{display:block; font-size:14px; margin-bottom:3px;}
    #printArea .pSynth{margin-top:16px; padding-top:12px; border-top:2px solid #111; font-style:italic;}
  }
</style>

<style>
/* ==== mobile hardening (added for the Temple app build) ==== */
html { -webkit-text-size-adjust: 100%; }

/* nothing should ever force a sideways scroll on a phone */
body { overflow-x: hidden; }
img, canvas, svg, video, iframe { max-width: 100%; }

/* kill the 300ms double-tap delay and give fingers a real target */
button, [role="button"], a.btn, .nav-btn, .action-btn, .culture-btn, .chap-btn {
  touch-action: manipulation;
}
@media (pointer: coarse) and (max-width: 600px) {
  button, [role="button"], .nav-btn, .action-btn { min-height: 44px; }
}

/* respect the system setting - also saves battery on the particle canvases */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* offline notice - shown only when the device actually drops connection */
#omtOfflineBar {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 99999;
  background: #2a1d00; color: #ffe2a8;
  border-top: 1px solid #ffcc66;
  font: 500 13px/1.4 system-ui, sans-serif;
  text-align: center; padding: 10px 14px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
}
body.omt-offline #omtOfflineBar { display: block; }
</style>

<body>
<canvas id="embers" aria-hidden="true"></canvas>
<div id="app">

  <nav id="topnav">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19" stroke-opacity="0.9"/><circle cx="12" cy="12" r="4"/></svg>
      The Fatal Grace
    </div>
    <div id="navlinks">
      <button data-view="landing" class="active">Threshold</button>
      <button data-view="tarot">Tarot</button>
      <button data-view="runes">Runes</button>
      <button data-view="lithomancy">Lithomancy</button>
      <button data-view="journal">Journal</button>
    </div>
  </nav>

  <!-- ============ LANDING ============ -->
  <section id="landing" class="view active">
    <div style="max-width:1100px; margin:0 auto; text-align:center; padding-top:2vh;">
      <span class="eyebrow" id="moonLabel">Loading the sky…</span>
      <h1 class="display" style="font-size:clamp(2.1rem,5vw,3.6rem); color:var(--gold-bright); font-weight:700; margin-bottom:6px;">Enter the Grace</h1>
      <p style="max-width:560px; margin:0 auto; color:var(--bone); font-style:italic;">Three tables, one working. Choose your rite — the cards, the bones, or the stones cast upon the Grace inverted.</p>

      <div id="graceHero" style="margin:34px auto; width:min(340px,70vw);"></div>

      <div id="doors" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px; margin-top:20px; text-align:left;"></div>
    </div>
  </section>

  <!-- ============ TAROT ============ -->
  <section id="tarot" class="view"></section>

  <!-- ============ RUNES ============ -->
  <section id="runes" class="view"></section>

  <!-- ============ LITHOMANCY ============ -->
  <section id="lithomancy" class="view"></section>

  <!-- ============ JOURNAL ============ -->
  <section id="journal" class="view"></section>

</div>

<script>
'use strict';

/* ---------------- Persistent Local Storage Engine ---------------- */
const STORAGE_KEY = 'fatal_grace_journal_v1';

function getStoredEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.warn("Local storage unavailable; defaulting to session storage.");
    return window._fg_session_journal || [];
  }
}

function saveStoredEntries(entries) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  } catch (e) {
    window._fg_session_journal = entries;
  }
  // Velo / Wix Custom Event dispatch
  window.dispatchEvent(new CustomEvent('fatalGraceReadingSaved', { detail: entries[0] }));
}

function addJournalEntry(kind, title, lines, synthesis = '') {
  const entries = getStoredEntries();
  const newEntry = {
    id: 'fg_' + Date.now(),
    kind, 
    title, 
    lines,
    synthesis,
    when: new Date().toLocaleString(undefined, {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})
  };
  entries.unshift(newEntry);
  saveStoredEntries(entries);
  renderJournal();
}

function deleteJournalEntry(id) {
  let entries = getStoredEntries();
  entries = entries.filter(e => e.id !== id);
  saveStoredEntries(entries);
  renderJournal();
}

function clearAllJournalEntries() {
  if (confirm("Are you sure you wish to clear all recorded divinations?")) {
    saveStoredEntries([]);
    renderJournal();
  }
}

/* ---------------- Ambient Embers ---------------- */
(function embers(){
  const canvas = document.getElementById('embers');
  const ctx = canvas.getContext('2d');
  let w,h,particles;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; }
  function makeParticles(){
    particles = Array.from({length: reduce?0:38}, ()=>({
      x: Math.random()*w, y: Math.random()*h,
      r: Math.random()*1.6+0.4,
      vy: -(Math.random()*0.35+0.08),
      vx: (Math.random()-0.5)*0.12,
      a: Math.random()*0.5+0.15,
      hue: Math.random()<0.5 ? '184,146,63' : '122,36,54'
    }));
  }
  window.addEventListener('resize', ()=>{resize(); makeParticles();});
  resize(); makeParticles();
  function tick(){
    ctx.clearRect(0,0,w,h);
    for(const p of particles){
      p.x+=p.vx; p.y+=p.vy;
      if(p.y<-10){ p.y=h+10; p.x=Math.random()*w; }
      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.hue},${p.a})`;
      ctx.shadowColor = `rgba(${p.hue},${p.a})`;
      ctx.shadowBlur = 6;
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ---------------- Web Audio Chimes ---------------- */
let audioCtx;
function chime(kind){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const notesByKind = {
      draw:[523.25,659.25,783.99],
      cast:[196.00,246.94,293.66],
      reveal:[392.00,493.88,587.33,739.99]
    };
    const notes = notesByKind[kind]||notesByKind.draw;
    notes.forEach((freq,i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      const start = now + i*0.09;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.05, start+0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.9);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start); osc.stop(start+0.95);
    });
  }catch(e){}
}

/* ---------------- Moon Phase ---------------- */
function moonPhase(date=new Date()){
  const synodic = 29.530588853;
  const known = Date.UTC(2000,0,6,18,14);
  const diffDays = (date.getTime()-known)/86400000;
  let phase = (diffDays % synodic)/synodic;
  if(phase<0) phase+=1;
  const names = [
    [0.0225,'New Moon','🌑'],[0.2225,'Waxing Crescent','🌒'],[0.2725,'First Quarter','🌓'],
    [0.4725,'Waxing Gibbous','🌔'],[0.5225,'Full Moon','🌕'],[0.7225,'Waning Gibbous','🌖'],
    [0.7725,'Last Quarter','🌗'],[0.9725,'Waning Crescent','🌘'],[1.01,'New Moon','🌑']
  ];
  for(const [upto,name,glyph] of names){ if(phase<=upto) return {name,glyph,phase}; }
  return {name:'New Moon', glyph:'🌑', phase};
}
(function setMoon(){
  const m = moonPhase();
  document.getElementById('moonLabel').textContent = `${m.glyph}  ${m.name}  ·  ${new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'})}`;
})();

/* ---------------- Sigil SVG Builder ---------------- */
function graceSVG({size=340, animated=false, id='grace'}={}){
  const cx=size/2, cy=size/2;
  const rOuter = size*0.46, rSquareHalf = rOuter/Math.SQRT2, rInner = rSquareHalf, rStar = rInner*0.62;
  function starPoints(r, inward){
    const pts=[]; const spikes=8;
    for(let i=0;i<spikes*2;i++){
      const ang = (Math.PI/spikes)*i - Math.PI/2;
      const rad = i%2===0 ? r : r*(inward?0.34:0.94);
      pts.push([cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)]);
    }
    return pts.map(p=>p.join(',')).join(' ');
  }
  const sq = rSquareHalf;
  const squarePts = [[cx,cy-sq*Math.SQRT2],[cx+sq*Math.SQRT2,cy],[cx,cy+sq*Math.SQRT2],[cx-sq*Math.SQRT2,cy]].map(p=>p.join(',')).join(' ');
  const spin = animated ? `<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="140s" repeatCount="indefinite"/>` : '';
  const pulse = animated ? `<animate attributeName="opacity" values="0.55;1;0.55" dur="5.5s" repeatCount="indefinite"/>` : '';
  return `
  <svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" id="${id}" role="img" aria-label="The Fatal Grace sigil">
    <defs>
      <radialGradient id="${id}-glow" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#e0b859" stop-opacity="0.35"/>
        <stop offset="60%" stop-color="#5c1a2b" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="${rOuter*1.35}" fill="url(#${id}-glow)"/>
    <g stroke="#b8923f" stroke-width="1" opacity="0.55">
      ${spin}
      <line x1="${cx}" y1="2" x2="${cx}" y2="${size-2}"/>
      <line x1="2" y1="${cy}" x2="${size-2}" y2="${cy}"/>
      <line x1="${cx-rOuter*1.3*0.7}" y1="${cy-rOuter*1.3*0.7}" x2="${cx+rOuter*1.3*0.7}" y2="${cy+rOuter*1.3*0.7}"/>
      <line x1="${cx-rOuter*1.3*0.7}" y1="${cy+rOuter*1.3*0.7}" x2="${cx+rOuter*1.3*0.7}" y2="${cy-rOuter*1.3*0.7}"/>
    </g>
    <circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="none" stroke="#3a0f1c" stroke-width="3"/>
    <circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="none" stroke="#b8923f" stroke-width="1" opacity="0.7"/>
    <polygon points="${squarePts}" fill="none" stroke="#7a2436" stroke-width="2.5"/>
    <polygon points="${squarePts}" fill="none" stroke="#e0b859" stroke-width="0.75" opacity="0.7"/>
    <circle cx="${cx}" cy="${cy}" r="${rInner}" fill="none" stroke="#352243" stroke-width="2"/>
    <polygon points="${starPoints(rStar,true)}" fill="#5c1a2b" fill-opacity="0.25" stroke="#e0b859" stroke-width="1.1">${pulse}</polygon>
    <circle cx="${cx}" cy="${cy}" r="${rStar*0.16}" fill="#e0b859">${pulse}</circle>
  </svg>`;
}

function angleDiff(a,b){ let d=Math.abs(a-b)%360; return d>180?360-d:d; }
function nearestRay(angleRad){
  const deg = angleRad*180/Math.PI;
  let best=RAYS[0], bestDiff=999;
  for(const ray of RAYS){ const diff=angleDiff(deg, ray.deg); if(diff<bestDiff){bestDiff=diff; best=ray;} }
  return best;
}

function printReading(getData){
  const data = getData();
  if(!data) return;
  const area = document.getElementById('printArea');
  const dateStr = new Date().toLocaleString(undefined,{weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'numeric', minute:'2-digit'});
  area.innerHTML = `
    <h2>The Fatal Grace — ${data.title}</h2>
    <div class="pMeta">${data.station} reading · ${dateStr}</div>
    ${data.entries.map(e=>`<div class="pEntry"><b>${e.label}${e.name?' — '+e.name:''}</b>${e.detail||''}</div>`).join('')}
    ${data.synthesis ? `<div class="pSynth">The Working, Read as a Whole: ${data.synthesis}</div>` : ''}
  `;
  window.print();
}
function downloadReading(getData){
  const data = getData();
  if(!data) return;
  const dateStr = new Date().toLocaleString();
  let text = `THE FATAL GRACE — ${data.title}\n${data.station} reading · ${dateStr}\n${'=' .repeat(50)}\n\n`;
  data.entries.forEach(e=>{
    text += `${e.label}${e.name?' — '+e.name:''}\n${e.detail||''}\n\n`;
  });
  if(data.synthesis) text += `${'-'.repeat(50)}\nTHE WORKING, READ AS A WHOLE\n${data.synthesis}\n`;
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fatal-grace-${data.station.toLowerCase()}-${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function shuffledDeck(){
  const d = [...TAROT_DECK];
  for(let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [d[i],d[j]]=[d[j],d[i]]; }
  return d;
}

function buildTarotSynthesis(drawn){
  const majors = drawn.filter(d=>d.card.a==='Major');
  const reversedCount = drawn.filter(d=>d.reversed).length;
  const total = drawn.length;
  const lines=[];
  
  if(majors.length===0){
    lines.push("<b>Domain of Daily Will:</b> No Major Arcana appeared. This working centers strictly on immediate choices, psychological habits, and practical circumstances rather than unyielding fate.");
  } else if(majors.length===total){
    lines.push("<b>Architects of Fate:</b> Every card drawn belongs to the Major Arcana. Deep, structural shifts are underway. Human willpower must yield to or align with higher necessity.");
  } else {
    lines.push(`<b>Fated Currents:</b> ${majors.length} of ${total} cards are Major Arcana (${majors.map(d=>d.card.n).join(', ')}), signaling that larger cosmological shifts are anchoring this situation.`);
  }

  const elementCounts={};
  drawn.forEach(d=>{ if(d.card.a!=='Major'){ const suit=SUITS.find(s=>s.name===d.card.a); if(suit) elementCounts[suit.element]=(elementCounts[suit.element]||0)+1; } });
  const elems = Object.entries(elementCounts).sort((a,b)=>b[1]-a[1]);
  if(elems.length && elems[0][1]>1){
    lines.push(`<b>Elemental Weight:</b> Dominated by <b>${elems[0][0]}</b> — the primary focus lies in ${elems[0][0]==='Fire'?'will, passion, and ambition':elems[0][0]==='Water'?'emotional depth and intuition':elems[0][0]==='Air'?'mental clarity and truth-telling':'practical structure, body, and material stability'}.`);
  }

  if(reversedCount===0) lines.push("<b>Unimpeded Flow:</b> Every card fell upright; the energies described move forward without internal blockage.");
  else if(reversedCount===total) lines.push("<b>The Inverted Mirror:</b> Every card fell reversed. Extreme internal resistance, blockage, or subconscious suppression is dominating this moment.");
  else if(reversedCount/total>=0.5) lines.push(`<b>Internalized Friction:</b> ${reversedCount} of ${total} cards are reversed, indicating that much of this situation's conflict is taking place internally or behind closed doors.`);
  
  return lines.join('<br><br>');
}

function buildRuneSynthesis(drawn){
  const lines=[];
  const hasBlank = drawn.some(d=>d.rune.n.includes('Blank'));
  const numbered = drawn.filter(d=>!d.rune.n.includes('Blank'));
  const aettCounts=[0,0,0];
  numbered.forEach(d=>{ AETTS.forEach((a,i)=>{ if(d.rune.num>=a.range[0] && d.rune.num<=a.range[1]) aettCounts[i]++; }); });
  const topAett = aettCounts.indexOf(Math.max(...aettCounts));
  
  if(Math.max(...aettCounts)>1){
    lines.push(`<b>Cosmological Focus:</b> Dominated by <b>${AETTS[topAett].name}</b>, indicating that this casting centers primarily on ${AETTS[topAett].theme}.`);
  }

  const reversedCount = drawn.filter(d=>d.reversed).length;
  const total = drawn.length;
  if(reversedCount===0) lines.push("<b>Direct Alignment:</b> All staves fell upright — the primal forces move plainly into the open.");
  else if(reversedCount/total>=0.5) lines.push(`<b>Inverted Forces:</b> ${reversedCount} of ${total} staves fell reversed, signaling internal strain, blocked flow, or lessons requiring introspection before action.`);

  if(hasBlank) lines.push("<b>The Mark of Wyrd:</b> The Blank Rune has entered the working. Certain parameters of this outcome are deliberately unwritten and remain held in cosmic trust.");

  return lines.join('<br><br>');
}

let stoneCount = 5;
let lithoMaterial = 'riverstone';
document.getElementById('stoneCountPicker').addEventListener('click', e=>{
  const btn=e.target.closest('.pill'); if(!btn) return;
  document.querySelectorAll('#stoneCountPicker .pill').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  stoneCount = Number(btn.dataset.n);
});
document.getElementById('lithoMatPicker').addEventListener('click', e=>{
  const sw = e.target.closest('.matSwatch'); if(!sw) return;
  document.querySelectorAll('#lithoMatPicker .matSwatch').forEach(s=>s.classList.remove('on'));
  sw.classList.add('on');
  lithoMaterial = sw.dataset.mat;
});

function renderLithoStage(){
  const stage = document.getElementById('lithoStage');
  stage.innerHTML = graceSVG({size:480, animated:false, id:'lithoGrace'});
}
renderLithoStage();

const BONE_SVG = `<svg viewBox="0 0 40 20" width="100%" height="100%"><path d="M10 10 a4.2 4.2 0 1 1 8.4 0 h3.2 a4.2 4.2 0 1 1 8.4 0 a4.2 4.2 0 1 1 -8.4 0 h-3.2 a4.2 4.2 0 1 1 -8.4 0 Z" fill="#e9dfc3" stroke="#a89b76" stroke-width="1"/></svg>`;

function buildLithoSynthesis(results){
  const counts={};
  results.forEach(r=>{ counts[r.zone.key]=(counts[r.zone.key]||0)+1; });
  const topZoneKey = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  const topZone = GRACE_ZONES.find(z=>z.key===topZoneKey);
  
  const rayCounts={};
  results.forEach(r=>{ rayCounts[r.ray.label]=(rayCounts[r.ray.label]||0)+1; });
  const topRayLabel = Object.entries(rayCounts).sort((a,b)=>b[1]-a[1])[0][0];
  const topRay = RAYS.find(r=>r.label===topRayLabel);

  const lines=[];
  lines.push(`<b>Primary Gravitation:</b> The majority of casting pieces gathered within <b>${topZone.name}</b>, showing that this working centers fundamentally on ${topZone.gist}.`);
  lines.push(`<b>Directional Pull:</b> The pull toward <b>${topRay.label} (${topRay.name})</b> is strongest — interpret this cast primarily through ${topRay.meaning}.`);
  
  if(counts.beyond) {
    lines.push(`<b>Wild Elements:</b> ${counts.beyond} piece${counts.beyond>1?'s':''} landed outside the Grace entirely, representing factors that refuse to be bound by current expectations.`);
  }

  return lines.join('<br><br>');
}

let lastLithoReading = null;

function castStones(){
  const stage = document.getElementById('lithoStage');
  renderLithoStage();
  const size = stage.clientWidth;
  const cx=size/2, cy=size/2;
  const results = [];
  
  for(let i=0;i<stoneCount;i++){
    const angle = Math.random()*Math.PI*2;
    const rFrac = Math.random()*0.64;
    const r = rFrac*size;
    const x = cx + r*Math.cos(angle);
    const y = cy + r*Math.sin(angle);
    const zone = zoneFor(rFrac);
    const ray = nearestRay(angle);
    results.push({x,y,zone,ray});

    if(lithoMaterial==='bone'){
      const wrap = document.createElement('div');
      wrap.className='bonePiece';
      wrap.style.left=x+'px'; wrap.style.top=y+'px';
      wrap.style.setProperty('--rot', (Math.random()*360)+'deg');
      wrap.innerHTML = BONE_SVG;
      stage.appendChild(wrap);
      setTimeout(()=>wrap.classList.add('dropped'), 120*i+80);
    } else {
      const stoneEl = document.createElement('div');
      stoneEl.className = `stone mat-${lithoMaterial}`;
      stoneEl.style.left = x+'px';
      stoneEl.style.top = y+'px';
      stage.appendChild(stoneEl);
      setTimeout(()=>stoneEl.classList.add('dropped'), 120*i + 80);
    }
  }
  chime('cast');

  const report = document.getElementById('zoneReport');
  const synthesisBox = document.getElementById('lithoSynthesis');
  const actions = document.getElementById('lithoActions');
  synthesisBox.style.display='none';
  actions.style.display='none';
  report.classList.remove('show');
  report.innerHTML='';

  setTimeout(()=>{
    report.classList.add('show');
    report.innerHTML = results.map((r,i)=>`
      <div class="readCard">
        <h4><span>Piece ${i+1} — <b>${r.zone.name}</b> · ${r.ray.label} (${r.ray.name})</span></h4>
        <div class="meaning">${r.zone.reading} Pointing toward <b>${r.ray.label}</b>, it draws in ${r.ray.meaning}.</div>
      </div>
    `).join('');
    
    chime('reveal');
    const synText = buildLithoSynthesis(results);
    synthesisBox.style.display='block';
    synthesisBox.innerHTML = `<div class="synTitle"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5-6.5 4.5 2-7.5-5.5-4.5h7z"/></svg> The Working, Read as a Whole</div><p>${synText}</p>`;
    actions.style.display='flex';

    lastLithoReading = {
      station:'Lithomancy', title:`${stoneCount}-Piece Casting (${lithoMaterial})`,
      entries: results.map((r,i)=>({label:`Piece ${i+1}`, name:`${r.zone.name} · ${r.ray.label}`, detail: `${r.zone.reading} Pointing toward ${r.ray.label}, it draws in ${r.ray.meaning}.`})),
      synthesis: synText.replace(/<[^>]*>/g, '')
    };

    addJournalEntry('Lithomancy', `${stoneCount}-Piece Cast (${lithoMaterial})`,
      results.map((r,i)=>`<b>Piece ${i+1}:</b> ${r.zone.name} / ${r.ray.label} (${r.ray.name})`),
      synText.replace(/<[^>]*>/g, ' '));
  }, 120*stoneCount + 500);
}

document.getElementById('castBtn').addEventListener('click', castStones);
document.getElementById('lithoPrintBtn').addEventListener('click', ()=>printReading(()=>lastLithoReading));
document.getElementById('lithoDownloadBtn').addEventListener('click', ()=>downloadReading(()=>lastLithoReading));
document.getElementById('lithoResetBtn').addEventListener('click', ()=>{
  renderLithoStage();
  document.getElementById('zoneReport').innerHTML='';
  document.getElementById('zoneReport').classList.remove('show');
  document.getElementById('lithoSynthesis').style.display='none';
  document.getElementById('lithoActions').style.display='none';
});

/* ================================================================
   JOURNAL STATION
   ================================================================ */
document.getElementById('journal').innerHTML = `
  <div class="stationHead">
    <span class="eyebrow">The Record</span>
    <h2>Reading Journal</h2>
    <p>Every rite performed is automatically preserved below in your browser's local memory.</p>
  </div>
  <div class="journalList" id="journalList"></div>
  
`;

renderJournal();
</script>

<script>
/* ==== mobile hardening (added for the Temple app build) ==== */
(function () {
  // 1. Hold animation frames while the app is backgrounded, then resume.
  //    Without this the particle loops keep requesting frames in standalone
  //    mode and quietly drain the battery.
  if (window.requestAnimationFrame) {
    var native = window.requestAnimationFrame.bind(window);
    var held = new Set();
    window.requestAnimationFrame = function (cb) {
      if (document.hidden) { held.add(cb); return -1; }
      return native(cb);
    };
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && held.size) {
        var queued = Array.from(held);
        held.clear();
        queued.forEach(function (cb) { native(cb); });
      }
    });
  }

  // 2. Tell the user when they're offline, so a failed save reads as
  //    "no signal" rather than "this app is broken".
  function ensureBar() {
    if (document.getElementById('omtOfflineBar')) return;
    var bar = document.createElement('div');
    bar.id = 'omtOfflineBar';
    bar.textContent = "You're offline \u2014 anything you send will need a connection. Everything else keeps working.";
    document.body.appendChild(bar);
  }
  function sync() {
    ensureBar();
    document.body.classList.toggle('omt-offline', !navigator.onLine);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sync);
  } else { sync(); }
  window.addEventListener('online', sync);
  window.addEventListener('offline', sync);
})();
</script>
