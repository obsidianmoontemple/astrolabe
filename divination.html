<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Temple of the Obsidian Moon</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07060a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="description" content="The Temple of the Obsidian Moon — star chart, altar, mirror, divination, kid zone and potion game. Works offline.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --obsidian: #07060a;
  --obsidian-card: #0e0a17;
  --indigo: #130d24;
  --amethyst: #6e3ba7;
  --amethyst-glow: #9d5bd2;
  --amethyst-light: #c092f0;
  --silver: #adabcc;
  --moonwhite: #f1effa;
  --acid-green: #39ff14;
  --acid-green-dim: #26b30c;
  --line: rgba(157, 91, 210, 0.22);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--moonwhite);
  font-family: 'Work Sans', system-ui, sans-serif;
  font-weight: 300;
  line-height: 1.6;
  overflow-x: hidden;
  background:
    radial-gradient(1px 1px at 18% 24%, rgba(57,255,20,0.40), transparent),
    radial-gradient(1.5px 1.5px at 72% 12%, rgba(157,91,210,0.50), transparent),
    radial-gradient(1.5px 1.5px at 86% 52%, rgba(173,171,204,0.40), transparent),
    radial-gradient(1px 1px at 42% 68%, rgba(57,255,20,0.28), transparent),
    radial-gradient(1px 1px at 9% 82%, rgba(157,91,210,0.40), transparent),
    radial-gradient(2px 2px at 62% 38%, rgba(57,255,20,0.22), transparent),
    radial-gradient(1px 1px at 93% 78%, rgba(157,91,210,0.34), transparent),
    radial-gradient(1px 1px at 30% 92%, rgba(173,171,204,0.30), transparent),
    var(--obsidian);
  background-attachment: fixed;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
}

header {
  text-align: center;
  padding: 34px 20px 8px;
  max-width: 780px;
  margin: 0 auto;
}

header img {
  width: 108px; height: 108px;
  border-radius: 50%;
  display: block; margin: 0 auto 14px;
  border: 1px solid var(--line);
}

h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 600;
  font-size: clamp(1.7rem, 6.5vw, 2.5rem);
  letter-spacing: 0.04em;
  margin: 0 0 6px;
  color: var(--moonwhite);
}

.tagline {
  font-style: italic;
  font-family: 'Cormorant Garamond', Georgia, serif;
  color: var(--silver);
  font-size: clamp(0.95rem, 3.6vw, 1.1rem);
  margin: 0;
}

.moonline {
  margin: 16px auto 0;
  font-size: 0.78rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--acid-green);
  opacity: 0.85;
  min-height: 1.2em;
}

.rule {
  width: min(240px, 60%);
  height: 1px;
  margin: 22px auto 4px;
  background: linear-gradient(90deg, transparent, var(--amethyst-glow), transparent);
}

main {
  max-width: 820px;
  margin: 0 auto;
  padding: 18px 16px 40px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
  gap: 14px;
}

.card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: linear-gradient(160deg, var(--obsidian-card), var(--indigo));
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  text-decoration: none;
  color: inherit;
  min-height: 88px;
  transition: border-color .25s, transform .25s, box-shadow .25s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.card:hover, .card:focus-visible {
  border-color: var(--amethyst-glow);
  box-shadow: 0 0 24px rgba(157, 91, 210, 0.22);
  transform: translateY(-2px);
  outline: none;
}

.card:active { transform: scale(0.985); }

.card .glyph {
  flex: 0 0 46px;
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(110, 59, 167, 0.10);
}

.card .glyph svg { width: 25px; height: 25px; display: block; }

.card h2 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.22rem;
  font-weight: 600;
  margin: 0 0 2px;
  letter-spacing: 0.02em;
  color: var(--moonwhite);
}

.card p {
  margin: 0;
  font-size: 0.83rem;
  color: var(--silver);
  line-height: 1.45;
}

footer {
  text-align: center;
  padding: 0 20px 40px;
  color: rgba(173, 171, 204, 0.55);
  font-size: 0.74rem;
  letter-spacing: 0.05em;
}

footer a { color: var(--amethyst-light); text-decoration: none; }

#offlineBar {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999;
  background: #2a1d00; color: #ffe2a8;
  border-top: 1px solid #ffcc66;
  font-size: 13px; text-align: center;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
}
body.is-offline #offlineBar { display: block; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
  .card:hover { transform: none; }
}
</style>
</head>
<body>

<header>
  <img src="icons/icon-192.png" alt="">
  <h1>Temple of the Obsidian Moon</h1>
  <p class="tagline">Enter, and be welcome.</p>
  <p class="moonline" id="moonline"></p>
  <div class="rule"></div>
</header>

<main>
  <nav class="grid" id="grid"></nav>
</main>

<footer>
  Everything here works without a signal.<br>
  <a href="https://www.obsidianmoontemple.com" target="_blank" rel="noopener">obsidianmoontemple.com</a>
</footer>

<div id="offlineBar">You're offline — anything you send will need a connection. Everything else keeps working.</div>

<script>
/* ---------- the seven halls ---------- */
const SECTIONS = [
  { href: 'pages/portal.html',      title: 'The Temple Portal',   blurb: 'The heart of the Temple — moon phase, daily rite, and the sigil of the hour.',
    svg: '<path d="M12 2 3 8v13h6v-7h6v7h6V8z" fill="none" stroke="currentColor" stroke-width="1.4"/>' },
  { href: 'pages/astrolabe.html',   title: 'The Astrolabe',       blurb: 'Live star chart, orrery, and your natal reckoning.',
    svg: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4"/><ellipse cx="12" cy="12" rx="9" ry="3.4" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="12" cy="12" r="2" fill="currentColor"/>' },
  { href: 'pages/altar.html',       title: 'The Cyber Altar',     blurb: 'Light a taper, set an intent, and draw your sigil.',
    svg: '<path d="M12 3c1.6 2.6 3 4 3 6a3 3 0 1 1-6 0c0-2 1.4-3.4 3-6z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 21h12M9 21v-3h6v3" fill="none" stroke="currentColor" stroke-width="1.4"/>' },
  { href: 'pages/mirror.html',      title: 'The Obsidian Mirror', blurb: 'Ask, and listen for what the dark glass returns.',
    svg: '<ellipse cx="12" cy="10" rx="7" ry="8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 18v4M8 22h8" fill="none" stroke="currentColor" stroke-width="1.4"/>' },
  { href: 'pages/divination.html',  title: 'The Divination Station', blurb: 'Cards, casts, and the Fatal Grace.',
    svg: '<rect x="4" y="4" width="10" height="15" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M14.5 6.5 20 8.6l-3.4 10.2" fill="none" stroke="currentColor" stroke-width="1.3"/>' },
  { href: 'pages/potion-game.html', title: 'The Potion Game',     blurb: 'Gather, brew, and see what rises from the cauldron.',
    svg: '<path d="M9 3h6v5l4.2 8.4A3 3 0 0 1 16.5 21h-9a3 3 0 0 1-2.7-4.6L9 8z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.4 15h11.2" stroke="currentColor" stroke-width="1.2"/>' },
  { href: 'pages/kid-zone.html',    title: 'The Kid Zone',        blurb: 'Little witches welcome — lessons, quests and companions.',
    svg: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="10" r="1.1" fill="currentColor"/><circle cx="15" cy="10" r="1.1" fill="currentColor"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0" fill="none" stroke="currentColor" stroke-width="1.4"/>' }
];

document.getElementById('grid').innerHTML = SECTIONS.map(s => `
  <a class="card" href="${s.href}">
    <span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true">${s.svg}</svg></span>
    <span>
      <h2>${s.title}</h2>
      <p>${s.blurb}</p>
    </span>
  </a>`).join('');

/* ---------- moon phase, computed locally so it works offline ---------- */
(function () {
  const d = (Date.now() / 86400000) + 2440587.5 - 2451545.0;
  const rad = Math.PI / 180, s = x => Math.sin(x * rad);
  const L = 218.316 + 13.176396 * d, M = 134.963 + 13.064993 * d;
  const Ms = 357.529 + 0.98560028 * d, D = 297.850 + 12.190749 * d;
  const moon = L + 6.289 * s(M) - 1.274 * s(M - 2 * D) + 0.658 * s(2 * D) - 0.186 * s(Ms);
  const sun = 280.459 + 0.98564736 * d + 1.915 * s(Ms) + 0.020 * s(2 * Ms);
  let e = ((moon - sun) % 360 + 360) % 360;
  const names = ['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous',
                 'Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
  const name = names[Math.floor(((e + 22.5) % 360) / 45)];
  const lit = Math.round((1 - Math.cos(e * rad)) / 2 * 100);
  document.getElementById('moonline').textContent = `${name} · ${lit}% lit`;
})();

/* ---------- offline awareness ---------- */
(function () {
  const sync = () => document.body.classList.toggle('is-offline', !navigator.onLine);
  window.addEventListener('online', sync);
  window.addEventListener('offline', sync);
  sync();
})();

/* ---------- service worker ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW failed:', e));
  });
}
</script>
</body>
</html>
