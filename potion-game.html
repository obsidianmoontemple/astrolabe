<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#050505">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Digital Astrolabe & Natal Analyzer</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #eee;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

canvas {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
}

#controls {
    max-width: 840px;
    margin: 12px auto;
    padding: 12px 14px;
    background: #111;
    border: 1px solid #D4AF37;
    border-radius: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    font-size: 13px;
}

#controls label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    color: #D4AF37;
}

#controls .toggle {
    flex-direction: row;
    align-items: center;
    gap: 6px;
    color: #eee;
    cursor: pointer;
}

#controls input[type="number"],
#controls input[type="datetime-local"],
#controls input[type="text"],
#controls input[type="date"],
#controls input[type="time"] {
    background: #000;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 13px;
}

#controls button, .horoscopeControls button, .downloadRow button {
    background: #D4AF37;
    color: #000;
    border: none;
    border-radius: 4px;
    padding: 8px 12px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
}

#controls button:hover, .horoscopeControls button:hover, .downloadRow button:hover {
    background: #e8c252;
}

.downloadRow button {
    background: #222;
    color: #D4AF37;
    border: 1px solid #D4AF37;
}

.downloadRow button:hover {
    background: #333;
}

#status {
    width: 100%;
    font-size: 12px;
    color: #999;
}

#geoStatus {
    width: 100%;
    font-size: 11px;
    color: #777;
}

#starTooltip {
    position: absolute;
    display: none;
    pointer-events: none;
    background: #000;
    border: 1px solid #D4AF37;
    color: #fff;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 10;
}

.locationResults {
    width: 100%;
    display: none;
    background: #000;
    border: 1px solid #444;
    border-radius: 4px;
    margin-top: 2px;
    max-height: 170px;
    overflow-y: auto;
    font-size: 12px;
}

.locResultItem {
    padding: 6px 8px;
    border-bottom: 1px solid #222;
    cursor: pointer;
    color: #ddd;
}

.locResultItem:last-child { border-bottom: none; }
.locResultItem:hover { background: #1a1a1a; }

.locAttribution {
    width: 100%;
    font-size: 10px;
    color: #555;
}

#legend {
    max-width: 840px;
    margin: 0 auto 16px auto;
    font-size: 12px;
    color: #aaa;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    padding: 0 10px;
}

#legend span.swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
}

#orreryWrap {
    display: flex;
    justify-content: center;
    margin: 14px auto 16px auto;
    padding: 0 10px;
}

#notifBanner {
    display: none;
    max-width: 840px;
    margin: 0 auto 14px auto;
    background: #2a1d00;
    border: 1px solid #ffcc66;
    color: #ffe2a8;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    text-align: center;
}

#alignmentPanel {
    max-width: 840px;
    margin: 0 auto 30px auto;
    background: #111;
    border: 1px solid #D4AF37;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    max-height: 380px;
    overflow-y: auto;
}

#alignmentPanel h3 {
    color: #D4AF37;
    margin: 4px 0;
    font-size: 15px;
}

#alignmentPanel .subnote {
    color: #777;
    font-size: 11px;
    margin-bottom: 10px;
    display: block;
}

.alignEvent {
    padding: 6px 4px;
    border-bottom: 1px solid #292929;
}

.alignEvent:last-child { border-bottom: none; }

.alignEvent.soon {
    background: #2a1d00;
    border-left: 3px solid #ffcc66;
    padding-left: 8px;
}

#horoscopePanel {
    max-width: 840px;
    margin: 0 auto 30px auto;
    background: #111;
    border: 1px solid #D4AF37;
    border-radius: 6px;
    padding: 16px;
}

#horoscopePanel h3 {
    color: #D4AF37;
    margin: 4px 0 12px 0;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.horoscopeControls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
}

.horoscopeControls label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    color: #D4AF37;
    font-size: 13px;
}

#horoscopeResult {
    font-size: 13px;
    margin-bottom: 16px;
}

.horoSummary {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
}

.horoSign {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px 12px;
    flex: 1;
    min-width: 200px;
}

.horoSymbol {
    font-size: 28px;
    color: #D4AF37;
}

.natal-insights {
    background: #080808;
    border: 1px solid rgba(212, 175, 55, 0.4);
    border-radius: 6px;
    padding: 16px;
    margin-top: 14px;
}

.natal-insights h4 {
    color: #D4AF37;
    margin: 0 0 10px 0;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid #222;
    padding-bottom: 6px;
}

.insight-card {
    background: #111;
    border-left: 3px solid #D4AF37;
    padding: 10px 12px;
    margin-bottom: 10px;
    border-radius: 0 4px 4px 0;
}

.insight-card strong { color: #fff; font-size: 13px; }

.insight-card p {
    margin: 4px 0 0 0;
    color: #bbb;
    font-size: 12px;
    line-height: 1.4;
}

.element-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: bold;
    margin-right: 6px;
}
.elem-Fire { background: rgba(255, 85, 0, 0.2); color: #ff7733; border: 1px solid #ff5500; }
.elem-Earth { background: rgba(76, 175, 80, 0.2); color: #81c784; border: 1px solid #4caf50; }
.elem-Air { background: rgba(33, 150, 243, 0.2); color: #64b5f6; border: 1px solid #2196f3; }
.elem-Water { background: rgba(156, 39, 176, 0.2); color: #ba68c8; border: 1px solid #9c27b0; }

#zodiacWheelWrap {
    display: flex;
    justify-content: center;

#aspectLegend {
    max-width: 540px;
    margin: 10px auto 4px auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    font-size: 11px;
    color: #aaa;
}

#aspectLegend .swatch {
    display: inline-block;
    width: 18px;
    height: 0;
    border-top-width: 2px;
    border-top-style: solid;
    margin-right: 5px;
    vertical-align: middle;
}

.downloadRow {
    max-width: 840px;
    margin: 10px auto 16px auto;
    display: flex;
    justify-content: center;
    gap: 10px;
}

@media (max-width: 600px) {
    #controls, #horoscopePanel, #alignmentPanel { margin: 8px; padding: 10px; }
    .horoSign { min-width: 100%; }
}

@media print {
    #controls, #legend, #orreryWrap, #notifBanner, #alignmentPanel, #horoscopePanel, .downloadRow { display: none; }
    body { background: white; }
    canvas { border: 1px solid black; }

    body.printAllMode #orreryWrap,
    body.printAllMode #notifBanner,
    body.printAllMode #alignmentPanel,
    body.printAllMode #horoscopePanel { display: block !important; }
    
    body.printAllMode #horoscopePanel,
    body.printAllMode #alignmentPanel { page-break-inside: avoid; }

    body.printAllMode .horoscopeControls { display: none !important; }

/* ===================== EPHEMERIS MATH ===================== */

function julianDate(date) { return (date.getTime() / 86400000) + 2440587.5; }
function centuriesSinceJ2000(date) { return (julianDate(date) - 2451545.0) / 36525; }
function obliquityOfEcliptic(T) { return 23.439291 - 0.0130042 * T; }

function siderealTime(date, longitudeDeg) {
    const jd = julianDate(date);
    const T = (jd - 2451545.0) / 36525;
    let gmst = 280.46061837 + 360.98564736629 * (jd - 2451545) + 0.000387933 * T * T - (T * T * T) / 38710000;
    let lst = gmst + longitudeDeg;
    return ((lst % 360) + 360) % 360;
}

function parseAsUTC(value) {
    if (!value) return new Date();
    const [datePart, timePart] = value.split('T');
    const [y, m, d] = datePart.split('-').map(Number);
    const [hh, mm] = timePart.split(':').map(Number);
    return new Date(Date.UTC(y, m - 1, d, hh, mm));
}

function toUTCInputValue(date) {
    const pad = n => String(n).padStart(2, '0');
    return date.getUTCFullYear() + '-' + pad(date.getUTCMonth() + 1) + '-' + pad(date.getUTCDate()) + 'T' + pad(date.getUTCHours()) + ':' + pad(date.getUTCMinutes());
}

function raDecToAltAz(raDeg, decDeg, latDeg, lstDeg) {
    let ha = lstDeg - raDeg;
    ha = ((ha + 540) % 360) - 180;
    const haR = ha * Math.PI / 180, decR = decDeg * Math.PI / 180, latR = latDeg * Math.PI / 180;
    const sinAlt = Math.sin(decR) * Math.sin(latR) + Math.cos(decR) * Math.cos(latR) * Math.cos(haR);
    const alt = Math.asin(sinAlt);
    const denom = Math.cos(alt) * Math.cos(latR);
    let az;
    if (Math.abs(denom) < 1e-9) { az = 0; }
    else {
        let cosAz = (Math.sin(decR) - Math.sin(alt) * Math.sin(latR)) / denom;
        cosAz = Math.max(-1, Math.min(1, cosAz));
        az = Math.acos(cosAz);
        if (Math.sin(haR) > 0) az = (2 * Math.PI) - az;
    }
    return { alt: alt * 180 / Math.PI, az: az * 180 / Math.PI };
}

function projectAltAz(alt, az, radius) {
    if (alt < -2) return null;
    const r = radius * (90 - alt) / 90;
    const azRad = az * Math.PI / 180;
    return { x: r * Math.sin(azRad), y: -r * Math.cos(azRad) };
}

function planetHeliocentric(elements, T) {
    const a = elements.a[0] + elements.a[1] * T;
    const e = elements.e[0] + elements.e[1] * T;
    const I = elements.I[0] + elements.I[1] * T;
    const L = elements.L[0] + elements.L[1] * T;
    const peri = elements.peri[0] + elements.peri[1] * T;
    const node = elements.node[0] + elements.node[1] * T;

    let M = L - peri;
    M = ((M + 180) % 360 + 360) % 360 - 180;
    const eStar = e * 180 / Math.PI;
    let E = M + eStar * Math.sin(M * Math.PI / 180);

    for (let i = 0; i < 10; i++) {
        const dM = M - (E - eStar * Math.sin(E * Math.PI / 180));
        const dE = dM / (1 - e * Math.cos(E * Math.PI / 180));
        E += dE;
        if (Math.abs(dE) < 1e-7) break;
    }

    const Erad = E * Math.PI / 180;
    const xp = a * (Math.cos(Erad) - e);
    const yp = a * Math.sqrt(1 - e * e) * Math.sin(Erad);

    const w = (peri - node) * Math.PI / 180;
    const Om = node * Math.PI / 180;
    const Ir = I * Math.PI / 180;

    const cosW = Math.cos(w), sinW = Math.sin(w);
    const cosOm = Math.cos(Om), sinOm = Math.sin(Om);
    const cosI = Math.cos(Ir), sinI = Math.sin(Ir);

    const x = (cosW * cosOm - sinW * sinOm * cosI) * xp + (-sinW * cosOm - cosW * sinOm * cosI) * yp;
    const y = (cosW * sinOm + sinW * cosOm * cosI) * xp + (-sinW * sinOm + cosW * cosOm * cosI) * yp;
    const z = (sinW * sinI) * xp + (cosW * sinI) * yp;

    return { x, y, z };
}

function eclipticToEquatorial(x, y, z, epsDeg) {
    const eps = epsDeg * Math.PI / 180;
    return { x: x, y: y * Math.cos(eps) - z * Math.sin(eps), z: y * Math.sin(eps) + z * Math.cos(eps) };
}

function vectorToRaDec(v) {
    const r = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
    let ra = Math.atan2(v.y, v.x) * 180 / Math.PI;
    ra = ((ra % 360) + 360) % 360;
    const dec = Math.asin(v.z / r) * 180 / Math.PI;
    return { ra, dec };
}

function cometHeliocentric(comet, date) {
    const jd = julianDate(date);
    const period = 365.25 * Math.pow(comet.a, 1.5);
    let M = (360 / period) * (jd - comet.Tp);
    M = ((M % 360) + 360) % 360;
    if (M > 180) M -= 360;

    const e = comet.e;
    const eStar = e * 180 / Math.PI;
    let E = M + eStar * Math.sin(M * Math.PI / 180);

    for (let i = 0; i < 20; i++) {
        const dM = M - (E - eStar * Math.sin(E * Math.PI / 180));
        const dE = dM / (1 - e * Math.cos(E * Math.PI / 180));
        E += dE;
        if (Math.abs(dE) < 1e-7) break;
    }

    const Erad = E * Math.PI / 180;
    const xp = comet.a * (Math.cos(Erad) - e);
    const yp = comet.a * Math.sqrt(1 - e * e) * Math.sin(Erad);

    const w = comet.peri * Math.PI / 180;
    const Om = comet.node * Math.PI / 180;
    const Ir = comet.I * Math.PI / 180;

    const cosW = Math.cos(w), sinW = Math.sin(w);
    const cosOm = Math.cos(Om), sinOm = Math.sin(Om);
    const cosI = Math.cos(Ir), sinI = Math.sin(Ir);

    const x = (cosW * cosOm - sinW * sinOm * cosI) * xp + (-sinW * cosOm - cosW * sinOm * cosI) * yp;
    const y = (cosW * sinOm + sinW * cosOm * cosI) * xp + (-sinW * sinOm + cosW * cosOm * cosI) * yp;
    const z = (sinW * sinI) * xp + (cosW * sinI) * yp;

    return { x, y, z };
}

let _bodiesCache = { key: null, value: null };
function getBodies(date) {
    // Bucket to 60s: sky positions change imperceptibly within a minute,
    // so this collapses many redundant Kepler solves into one.
    const key = Math.floor(date.getTime() / 60000);
    if (_bodiesCache.key === key) return _bodiesCache.value;
    _bodiesCache = { key: key, value: computeBodies(date) };
    return _bodiesCache.value;
}

function computeBodies(date) {
    const T = centuriesSinceJ2000(date);
    const eps = obliquityOfEcliptic(T);
    const earthHelio = planetHeliocentric(planetElements.Earth, T);

    function eclLonOf(geoX, geoY) { return (Math.atan2(geoY, geoX) * 180 / Math.PI + 360) % 360; }

    const results = [];
    const sunGeo = { x: -earthHelio.x, y: -earthHelio.y, z: -earthHelio.z };
    const sunEq = eclipticToEquatorial(sunGeo.x, sunGeo.y, sunGeo.z, eps);
    const sunRD = vectorToRaDec(sunEq);
    results.push({ name: "Sun", type: "sun", color: "#FFD700", ra: sunRD.ra, dec: sunRD.dec, isSun: true, helio: { x: 0, y: 0, z: 0 }, eclLon: eclLonOf(sunGeo.x, sunGeo.y) });
    results.push({ name: "Earth", type: "earth", color: "#5b9bd5", helio: earthHelio });

    planetOrder.forEach(name => {
        const helio = planetHeliocentric(planetElements[name], T);
        const geo = { x: helio.x - earthHelio.x, y: helio.y - earthHelio.y, z: helio.z - earthHelio.z };
        const eq = eclipticToEquatorial(geo.x, geo.y, geo.z, eps);
        const rd = vectorToRaDec(eq);
        results.push({ name, type: "planet", color: planetElements[name].color, ra: rd.ra, dec: rd.dec, helio, eclLon: eclLonOf(geo.x, geo.y) });
    });

    comets.forEach(c => {
        const helio = cometHeliocentric(c, date);
        const geo = { x: helio.x - earthHelio.x, y: helio.y - earthHelio.y, z: helio.z - earthHelio.z };
        const eq = eclipticToEquatorial(geo.x, geo.y, geo.z, eps);
        const rd = vectorToRaDec(eq);
        results.push({ name: c.name, type: "comet", color: c.color, ra: rd.ra, dec: rd.dec, helio, eclLon: eclLonOf(geo.x, geo.y) });
    });

    return results;
}

// Low-precision lunar series (~10 arcmin). The previous single-term version
// omitted evection and variation and could be ~2 degrees out - enough to report
// the wrong Moon sign for anyone born near a cusp.
function moonEclipticPosition(date) {
    const d = julianDate(date) - 2451545.0;
    const rad = Math.PI / 180;
    const s = x => Math.sin(x * rad);

    const L  = 218.316 + 13.176396 * d;   // mean longitude
    const M  = 134.963 + 13.064993 * d;   // Moon mean anomaly
    const Ms = 357.529 + 0.98560028 * d;  // Sun mean anomaly
    const D  = 297.850 + 12.190749 * d;   // mean elongation
    const F  =  93.272 + 13.229350 * d;   // argument of latitude

    let lon = L
        + 6.289 * s(M)
        - 1.274 * s(M - 2 * D)
        + 0.658 * s(2 * D)
        - 0.186 * s(Ms)
        - 0.059 * s(2 * M - 2 * D)
        - 0.057 * s(M - 2 * D + Ms)
        + 0.053 * s(M + 2 * D)
        + 0.046 * s(2 * D - Ms)
        + 0.041 * s(M - Ms)
        - 0.035 * s(D)
        - 0.031 * s(M + Ms)
        - 0.015 * s(2 * F - 2 * D)
        + 0.011 * s(M - 4 * D);

    const lat = 5.128 * s(F)
        + 0.281 * s(M + F)
        - 0.278 * s(F - M)
        - 0.173 * s(F - 2 * D)
        + 0.055 * s(M + F - 2 * D)
        - 0.046 * s(M - F - 2 * D)
        + 0.033 * s(F + 2 * D)
        + 0.017 * s(2 * M + F);

    lon = ((lon % 360) + 360) % 360;
    return { lon: lon, lat: lat };
}

function moonEclipticLongitude(date) { return moonEclipticPosition(date).lon; }

function eclipticLonLatToRaDec(lonDeg, latDeg, epsDeg) {
    const rad = Math.PI / 180;
    const l = lonDeg * rad, b = latDeg * rad, e = epsDeg * rad;
    const x = Math.cos(b) * Math.cos(l);
    const y = Math.cos(b) * Math.sin(l) * Math.cos(e) - Math.sin(b) * Math.sin(e);
    const z = Math.cos(b) * Math.sin(l) * Math.sin(e) + Math.sin(b) * Math.cos(e);
    let ra = Math.atan2(y, x) / rad;
    ra = ((ra % 360) + 360) % 360;
    return { ra: ra, dec: Math.asin(z) / rad };
}

// Illuminated fraction and waxing/waning, from elongation against the Sun.
function moonPhase(date) {
    const moonLon = moonEclipticPosition(date).lon;
    const sun = getBodies(date).find(b => b.type === "sun");
    let elong = moonLon - sun.eclLon;
    elong = ((elong % 360) + 360) % 360;
    const illum = (1 - Math.cos(elong * Math.PI / 180)) / 2;
    let name;
    if (elong < 22.5 || elong >= 337.5) name = "New Moon";
    else if (elong < 67.5)  name = "Waxing Crescent";
    else if (elong < 112.5) name = "First Quarter";
    else if (elong < 157.5) name = "Waxing Gibbous";
    else if (elong < 202.5) name = "Full Moon";
    else if (elong < 247.5) name = "Waning Gibbous";
    else if (elong < 292.5) name = "Last Quarter";
    else name = "Waning Crescent";
    return { illum: illum, name: name, elongation: elong };
}

function computeAscendant(ramcDeg, latDeg, epsDeg) {
    const ramc = ramcDeg * Math.PI / 180, lat = latDeg * Math.PI / 180, eps = epsDeg * Math.PI / 180;
    const y = -Math.cos(ramc);
    const x = Math.sin(eps) * Math.tan(lat) + Math.cos(eps) * Math.sin(ramc);
    const asc = Math.atan2(y, x) * 180 / Math.PI;
    return ((asc % 360) + 360) % 360;
}

function computeMidheaven(ramcDeg, epsDeg) {
    const ramc = ramcDeg * Math.PI / 180, eps = epsDeg * Math.PI / 180;
    const mc = Math.atan2(Math.sin(ramc) * Math.cos(eps), Math.cos(ramc)) * 180 / Math.PI;
    return ((mc % 360) + 360) % 360;
}

function computeEqualHouses(ascendantDeg) {
    const houses = [];
    for (let i = 0; i < 12; i++) houses.push(((ascendantDeg + i * 30) % 360 + 360) % 360);
    return houses;
}

function eclipticLonToZodiac(lon) {
    const norm = ((lon % 360) + 360) % 360;
    const idx = Math.floor(norm / 30);
    return { idx, degInSign: norm % 30, data: zodiacData[idx] };
}

/* ===================== ALIGNMENT SCANNER ENGINE ===================== */

const ALIGN_DAYS_AHEAD = 180;
const ALIGN_THRESH = { planet: 5, star: 1.5, comet: 6, grand: 30 };
const majorStars = stars.filter(s => s.mag <= 2.0);

function angularSeparation(ra1, dec1, ra2, dec2) {
    const r1 = ra1 * Math.PI / 180, d1 = dec1 * Math.PI / 180;
    const r2 = ra2 * Math.PI / 180, d2 = dec2 * Math.PI / 180;
    const cosSep = Math.sin(d1) * Math.sin(d2) + Math.cos(d1) * Math.cos(d2) * Math.cos(r1 - r2);
    return Math.acos(Math.max(-1, Math.min(1, cosSep))) * 180 / Math.PI;
}

function scanAlignments(startDate) {
    const events = [];
    const snapshots = [];
    for (let d = 0; d <= ALIGN_DAYS_AHEAD; d++) {
        const date = new Date(startDate.getTime() + d * 86400000);
        const bodies = computeBodies(date).filter(b => b.type !== "earth");
        snapshots.push({ date, bodies });
    }
    const names = snapshots[0].bodies.map(b => b.name);
    const isComet = nm => comets.some(c => c.name === nm);

    for (let i = 0; i < names.length; i++) {
        for (let j = i + 1; j < names.length; j++) {
            const nameA = names[i], nameB = names[j];
            const threshold = (isComet(nameA) || isComet(nameB)) ? ALIGN_THRESH.comet : ALIGN_THRESH.planet;
            const series = snapshots.map(s => {
                const a = s.bodies.find(b => b.name === nameA);
                const b = s.bodies.find(b => b.name === nameB);
                return (a && b) ? angularSeparation(a.ra, a.dec, b.ra, b.dec) : null;
            });
            for (let idx = 0; idx < series.length; idx++) {
                if (series[idx] == null || series[idx] > threshold) continue;
                const prev = idx > 0 ? series[idx - 1] : null;
                const next = idx < series.length - 1 ? series[idx + 1] : null;
                if ((prev == null || series[idx] <= prev) && (next == null || series[idx] <= next)) {
                    events.push({ date: snapshots[idx].date, label: nameA + " ↔ " + nameB, separation: series[idx], type: "conjunction" });
                }
            }
        }
    }
    return events;
}

function dedupeEvents(events) {
    events.sort((a, b) => a.date - b.date);
    const out = [];
    events.forEach(e => {
        const dup = out.find(o => o.label === e.label && Math.abs(o.date - e.date) < 5 * 86400000);
        if (!dup) out.push(Object.assign({}, e));
    });
    return out;
}

function renderAlignmentPanel(events) {
    const now = new Date();
    const soonMs = 5 * 86400000;
    if (events.length === 0) {
        alignmentPanelEl.innerHTML = '<h3>Upcoming Alignments</h3><span class="subnote">Approximate positions for visualization.</span><div style="color:#777;">No major alignments found in next ' + ALIGN_DAYS_AHEAD + ' days.</div>';
        notifBannerEl.style.display = "none";
        return;
    }
    const soon = events.filter(e => (e.date - now) <= soonMs && (e.date - now) >= -86400000);
    if (soon.length > 0) {
        notifBannerEl.style.display = "block";
        notifBannerEl.textContent = "✨ Upcoming: " + soon.map(e => e.label + " on " + e.date.toISOString().slice(0, 10)).join("   |   ");
    } else {
        notifBannerEl.style.display = "none";
    }
    alignmentPanelEl.innerHTML = '<h3>Upcoming Alignments (next ' + ALIGN_DAYS_AHEAD + ' days)</h3>' +
        '<span class="subnote">Approximate celestial alignments for visual tracking.</span>' +
        events.slice(0, 35).map(e => {
            const isSoon = (e.date - now) <= soonMs && (e.date - now) >= -86400000;
            const dateStr = e.date.toISOString().slice(0, 10);
            const sepStr = e.separation != null ? (" — " + e.separation.toFixed(1) + "° apart") : "";
            return '<div class="alignEvent' + (isSoon ? ' soon' : '') + '"><strong>' + dateStr + '</strong> &middot; ' + e.label + sepStr + ' <span style="color:#777;">(' + e.type + ')</span></div>';
        }).join('');
}

function refreshAlignments() {
    const baseDate = getCurrentDate();
    const events = dedupeEvents(scanAlignments(baseDate));
    renderAlignmentPanel(events);
    activeAlignments = computeActiveAlignmentsToday(baseDate);
    requestRender();
}

function computeActiveAlignmentsToday(date) {
    const bNow = computeBodies(date).filter(b => b.type !== "earth");
    const names = bNow.map(b => b.name);
    const active = [];

    for (let i = 0; i < names.length; i++) {
        for (let j = i + 1; j < names.length; j++) {
            const nameA = names[i], nameB = names[j];
            const aNow = bNow.find(b => b.name === nameA), bNowB = bNow.find(b => b.name === nameB);
            if (!aNow || !bNowB) continue;
            const sepNow = angularSeparation(aNow.ra, aNow.dec, bNowB.ra, bNowB.dec);
            if (sepNow <= ALIGN_THRESH.planet) {
                active.push({ kind: "conjunction", nameA, nameB, separation: sepNow });
            }
        }
    }
    return active;
}

/* ===================== ZODIAC ASPECTS & WHEEL DRAWING ===================== */

const ASPECTS = [
    { name: "Sextile",   angle: 60,  orb: 5, color: "#4fc3f7", dash: [4, 3] },
    { name: "Square",    angle: 90,  orb: 6, color: "#ff6b6b", dash: [4, 3] },
    { name: "Trine",     angle: 120, orb: 6, color: "#66d98a", dash: [] },
    { name: "Opposition", angle: 180, orb: 8, color: "#ff6b6b", dash: [] }
];

function computeAspects(chartBodies) {
    const aspects = [];
    for (let i = 0; i < chartBodies.length; i++) {
        for (let j = i + 1; j < chartBodies.length; j++) {
            let diff = Math.abs(chartBodies[i].lon - chartBodies[j].lon) % 360;
            if (diff > 180) diff = 360 - diff;
            for (const asp of ASPECTS) {
                if (Math.abs(diff - asp.angle) <= asp.orb) {
                    aspects.push({ a: chartBodies[i], b: chartBodies[j], aspect: asp });
                    break;
                }
            }
        }
    }
    return aspects;
}

function buildAspectLegend() {
    const items = [
        { label: "Trine (harmonious)", color: "#66d98a", dash: false },
        { label: "Sextile (harmonious)", color: "#4fc3f7", dash: true },
        { label: "Square (tension)", color: "#ff6b6b", dash: true },
        { label: "Opposition (tension)", color: "#ff6b6b", dash: false }
    ];
    aspectLegendEl.innerHTML = items.map(it => '<span><span class="swatch" style="border-top-color:' + it.color + (it.dash ? ';border-top-style:dashed' : '') + '"></span>' + it.label + '</span>').join('');
}
buildAspectLegend();

function computeStackedPositions(chartBodies) {
    const sorted = [...chartBodies].sort((a, b) => a.lon - b.lon);
    const n = sorted.length;
    if (n === 0) return [];
    let maxGap = -1, maxGapIdx = 0;
    for (let i = 0; i < n; i++) {
        const next = sorted[(i + 1) % n];
        let gap = next.lon - sorted[i].lon;
        if (gap < 0) gap += 360;
        if (gap > maxGap) { maxGap = gap; maxGapIdx = i; }
    }
    const ordered = sorted.slice(maxGapIdx + 1).concat(sorted.slice(0, maxGapIdx + 1));
    let stack = 0;
    return ordered.map((body, i) => {
        if (i > 0) {
            let diff = ordered[i].lon - ordered[i - 1].lon;
            if (diff < 0) diff += 360;
            stack = diff < 9 ? stack + 1 : 0;
        }
        return { body, stack };
    });
}

function drawZodiacWheel(chartBodies, highlightIdx, houses, ascendant, midheaven) {
    const W = zodiacWheelCanvas.width, H = zodiacWheelCanvas.height;
    const cx = W / 2, cy = H / 2;
    const outerR = Math.min(W, H) / 2 - 8;
    const bodyR = outerR - 90;

    zodiacCtx.clearRect(0, 0, W, H);

    for (let i = 0; i < 12; i++) {
        const startAngle = (i * 30 - 90) * Math.PI / 180;
        const endAngle = ((i + 1) * 30 - 90) * Math.PI / 180;

        zodiacCtx.beginPath();
        zodiacCtx.moveTo(cx, cy);
        zodiacCtx.arc(cx, cy, outerR, startAngle, endAngle);
        zodiacCtx.closePath();
        zodiacCtx.fillStyle = i === highlightIdx ? "rgba(212,175,55,0.35)" : (i % 2 === 0 ? "#111111" : "#171717");
        zodiacCtx.fill();
        zodiacCtx.strokeStyle = "#333333";
        zodiacCtx.lineWidth = 1;
        zodiacCtx.stroke();

        const midAngle = (i * 30 + 15 - 90) * Math.PI / 180;
        zodiacCtx.fillStyle = i === highlightIdx ? "#D4AF37" : "#888888";
        zodiacCtx.font = "20px serif";
        zodiacCtx.textAlign = "center";
        zodiacCtx.textBaseline = "middle";
        zodiacCtx.fillText(zodiacData[i].symbol, cx + (outerR - 26) * Math.cos(midAngle), cy + (outerR - 26) * Math.sin(midAngle));
    }

    if (houses) {
        houses.forEach((h, idx) => {
            const angle = (h - 90) * Math.PI / 180;
            zodiacCtx.strokeStyle = "rgba(160,160,160,0.35)";
            zodiacCtx.lineWidth = 1;
            zodiacCtx.beginPath();
            zodiacCtx.moveTo(cx + (bodyR + 14) * Math.cos(angle), cy + (bodyR + 14) * Math.sin(angle));
            zodiacCtx.lineTo(cx + (outerR - 4) * Math.cos(angle), cy + (outerR - 4) * Math.sin(angle));
            zodiacCtx.stroke();

            const labelR = bodyR + 24;
            zodiacCtx.fillStyle = "#666666";
            zodiacCtx.font = "9px Arial";
            zodiacCtx.fillText(String(idx + 1), cx + labelR * Math.cos(angle) - 3, cy + labelR * Math.sin(angle) + 3);
        });
    }

    zodiacCtx.beginPath();
    zodiacCtx.arc(cx, cy, bodyR + 14, 0, Math.PI * 2);
    zodiacCtx.fillStyle = "#0a0a0a";
    zodiacCtx.fill();
    zodiacCtx.strokeStyle = "#444444";
    zodiacCtx.lineWidth = 1;
    zodiacCtx.stroke();

    // DRAW ASPECT LINES INSIDE WHEEL
    const aspectR = Math.max(30, bodyR - 50);
    const aspects = computeAspects(chartBodies);
    aspects.forEach(asp => {
        const p1 = { x: cx + aspectR * Math.cos((asp.a.lon - 90) * Math.PI / 180), y: cy + aspectR * Math.sin((asp.a.lon - 90) * Math.PI / 180) };
        const p2 = { x: cx + aspectR * Math.cos((asp.b.lon - 90) * Math.PI / 180), y: cy + aspectR * Math.sin((asp.b.lon - 90) * Math.PI / 180) };
        zodiacCtx.strokeStyle = asp.aspect.color;
        zodiacCtx.lineWidth = 1.2;
        zodiacCtx.globalAlpha = 0.85;
        zodiacCtx.setLineDash(asp.aspect.dash);
        zodiacCtx.beginPath();
        zodiacCtx.moveTo(p1.x, p1.y);
        zodiacCtx.lineTo(p2.x, p2.y);
        zodiacCtx.stroke();
        zodiacCtx.setLineDash([]);
        zodiacCtx.globalAlpha = 1.0;
    });

    // DRAW STACKED BODY MARKERS & TICKS
    const tickR = bodyR + 14;
    computeStackedPositions(chartBodies).forEach(({ body, stack }) => {
        const angle = (body.lon - 90) * Math.PI / 180;
        const r = Math.max(34, bodyR - stack * 15);
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);

        zodiacCtx.strokeStyle = body.color || "#D4AF37";
        zodiacCtx.lineWidth = 1;
        zodiacCtx.beginPath();
        zodiacCtx.moveTo(cx + tickR * Math.cos(angle), cy + tickR * Math.sin(angle));
        zodiacCtx.lineTo(cx + (tickR - 6) * Math.cos(angle), cy + (tickR - 6) * Math.sin(angle));
        zodiacCtx.stroke();

        if (stack > 0) {
            zodiacCtx.strokeStyle = "rgba(255,255,255,0.2)";
            zodiacCtx.beginPath();
            zodiacCtx.moveTo(cx + (tickR - 6) * Math.cos(angle), cy + (tickR - 6) * Math.sin(angle));
            zodiacCtx.lineTo(x, y);
            zodiacCtx.stroke();
        }

        zodiacCtx.fillStyle = body.color || "#D4AF37";
        zodiacCtx.beginPath();
        zodiacCtx.arc(x, y, 5, 0, Math.PI * 2);
        zodiacCtx.fill();
        zodiacCtx.strokeStyle = "#ffffff";
        zodiacCtx.lineWidth = 1;
        zodiacCtx.stroke();

        zodiacCtx.fillStyle = "#dddddd";
        zodiacCtx.font = "10px Arial";
        zodiacCtx.fillText(body.name, x + 7, y - 6);
    });

    // ASC / MC MARKERS
    function drawAngleMarker(lonDeg, label, color) {
        if (lonDeg == null) return;
        const angle = (lonDeg - 90) * Math.PI / 180;
        zodiacCtx.strokeStyle = color;
        zodiacCtx.lineWidth = 2;
        zodiacCtx.beginPath();
        zodiacCtx.moveTo(cx, cy);
        zodiacCtx.lineTo(cx + outerR * Math.cos(angle), cy + outerR * Math.sin(angle));
        zodiacCtx.stroke();

        const labelR = outerR + 14;
        zodiacCtx.fillStyle = color;
        zodiacCtx.font = "bold 12px Arial";
        zodiacCtx.textAlign = "center";
        zodiacCtx.textBaseline = "middle";
        zodiacCtx.fillText(label, cx + labelR * Math.cos(angle), cy + labelR * Math.sin(angle));
    }
    drawAngleMarker(ascendant, "ASC", "#ff6b6b");
    drawAngleMarker(midheaven, "MC", "#6bb3ff");
}

/* ===================== DRAW ASTROLABE & ORRERY ===================== */

function getEclipticPoints(epsDeg, latDeg) {
    const eps = epsDeg * Math.PI / 180, latR = latDeg * Math.PI / 180, pts = [];
    for (let lon = 0; lon <= 360; lon += 4) {
        const lonR = lon * Math.PI / 180;
        const xecl = Math.cos(latR) * Math.cos(lonR);
        const yecl = Math.cos(latR) * Math.sin(lonR);
        const zecl = Math.sin(latR);
        const yeq = yecl * Math.cos(eps) - zecl * Math.sin(eps);
        const zeq = yecl * Math.sin(eps) + zecl * Math.cos(eps);
        pts.push({ ra: (Math.atan2(yeq, xecl) * 180 / Math.PI + 360) % 360, dec: Math.asin(zeq) * 180 / Math.PI });
    }
    return pts;
}

function drawSkyCurve(points, lat, lst, radius, cx, cy, color, dashed) {
    ctx.strokeStyle = color;
    ctx.lineWidth = dashed ? 1 : 1.5;
    ctx.setLineDash(dashed ? [4, 4] : []);
    ctx.beginPath();
    let started = false;
    points.forEach(pt => {
        const aa = raDecToAltAz(pt.ra, pt.dec, lat, lst);
        const p = projectAltAz(aa.alt, aa.az, radius);
        if (!p) { started = false; return; }
        if (!started) { ctx.moveTo(cx + p.x, cy + p.y); started = true; }
        else { ctx.lineTo(cx + p.x, cy + p.y); }
    });
    ctx.stroke(); ctx.setLineDash([]);
}

function drawConstellationLines(lat, lst, radius, cx, cy, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6 * (radius / 340);
    constellationLines.forEach(pair => {
        const s1 = starByName[pair[0]];
        const s2 = starByName[pair[1]];
        if (!s1 || !s2) return;
        const aa1 = raDecToAltAz(s1.ra, s1.dec, lat, lst);
        const aa2 = raDecToAltAz(s2.ra, s2.dec, lat, lst);
        const p1 = projectAltAz(aa1.alt, aa1.az, radius);
        const p2 = projectAltAz(aa2.alt, aa2.az, radius);
        if (!p1 || !p2) return;
        ctx.beginPath();
        ctx.moveTo(cx + p1.x, cy + p1.y);
        ctx.lineTo(cx + p2.x, cy + p2.y);
        ctx.stroke();
    });
}

function drawAstrolabe(date) {
    const lat = parseFloat(latInput.value) || 0, lon = parseFloat(lonInput.value) || 0;
    const cx = 500, cy = 500, radius = 420, scale = radius / 340;

    ctx.fillStyle = printMode ? "#ffffff" : "#050505";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = printMode ? "#000000" : "#D4AF37";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.stroke();

    ctx.strokeStyle = printMode ? "#888" : "#444";
    ctx.lineWidth = 1;
    for (let i = 1; i <= 5; i++) {
        const r = radius * (i / 6);
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.strokeStyle = printMode ? "#555" : "#888";
    for (let deg = 0; deg < 360; deg += 10) {
        const angle = (deg - 90) * Math.PI / 180;
        ctx.beginPath();
        ctx.moveTo(cx + (radius - 15) * Math.cos(angle), cy + (radius - 15) * Math.sin(angle));
        ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle));
        ctx.stroke();
    }

    const T = centuriesSinceJ2000(date), eps = obliquityOfEcliptic(T), lst = siderealTime(date, lon);

    if (showEcliptic.checked) {
        drawSkyCurve(getEclipticPoints(eps, 8), lat, lst, radius, cx, cy, printMode ? "#ccc" : "#665533", true);
        drawSkyCurve(getEclipticPoints(eps, -8), lat, lst, radius, cx, cy, printMode ? "#ccc" : "#665533", true);
        drawSkyCurve(getEclipticPoints(eps, 0), lat, lst, radius, cx, cy, printMode ? "#aa6600" : "#ffcc66", false);
    }

    if (showConstellations.checked) {
        drawConstellationLines(lat, lst, radius, cx, cy, printMode ? "#888" : "#5ec8ff");
    }

    let visibleCount = 0;
    starScreenPositions = [];
    stars.forEach(star => {
        const altAz = raDecToAltAz(star.ra, star.dec, lat, lst);
        const p = projectAltAz(altAz.alt, altAz.az, radius);
        if (!p) return;
        visibleCount++;
        if (showStars.checked) {
            const size = Math.max(1, 6 - star.mag);
            ctx.fillStyle = printMode ? "#000" : "#fff";
            ctx.beginPath(); ctx.arc(cx + p.x, cy + p.y, size, 0, Math.PI * 2); ctx.fill();
            starScreenPositions.push({ x: cx + p.x, y: cy + p.y, name: star.name, con: star.con });
        }
    });

    if (showPlanets.checked) {
        getBodies(date).filter(b => b.type === "sun" || b.type === "planet").forEach(p => {
            const aa = raDecToAltAz(p.ra, p.dec, lat, lst);
            const proj = projectAltAz(aa.alt, aa.az, radius);
            if (!proj) return;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(cx + proj.x, cy + proj.y, p.isSun ? 8 : 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = printMode ? "#000" : "#fff";
            ctx.font = "bold 11px Arial";
            ctx.fillText(p.name, cx + proj.x + 8, cy + proj.y - 6);
        });
    }

    // The Moon: computed for the natal wheel all along, but never actually
    // plotted on the sky chart until now.
    if (showPlanets.checked) {
        const mp = moonEclipticPosition(date);
        const mrd = eclipticLonLatToRaDec(mp.lon, mp.lat, eps);
        const maa = raDecToAltAz(mrd.ra, mrd.dec, lat, lst);
        const mproj = projectAltAz(maa.alt, maa.az, radius);
        if (mproj) {
            const ph = moonPhase(date);
            const mx = cx + mproj.x, my = cy + mproj.y;
            ctx.fillStyle = printMode ? "#ddd" : "#e8e8e8";
            ctx.beginPath(); ctx.arc(mx, my, 9, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = printMode ? "#000" : "#9a9a9a";
            ctx.lineWidth = 1; ctx.stroke();
            // shade the dark limb roughly in proportion to illumination
            ctx.fillStyle = printMode ? "#ffffff" : "#1a1a1a";
            ctx.beginPath();
            ctx.arc(mx, my, 9, Math.PI / 2, -Math.PI / 2, ph.elongation <= 180);
            ctx.ellipse(mx, my, 9 * Math.abs(1 - 2 * ph.illum), 9,
                        0, -Math.PI / 2, Math.PI / 2, ph.illum > 0.5);
            ctx.fill();
            ctx.fillStyle = printMode ? "#000" : "#fff";
            ctx.font = "bold 11px Arial";
            ctx.textAlign = "left";
            ctx.fillText("Moon", mx + 12, my - 6);
            ctx.font = "10px Arial";
            ctx.fillStyle = printMode ? "#333" : "#bbb";
            ctx.fillText(ph.name, mx + 12, my + 7);
            ctx.textAlign = "center";
        }
    }

    if (showComets.checked) {
        getBodies(date).filter(b => b.type === "comet").forEach(c => {
            const aa = raDecToAltAz(c.ra, c.dec, lat, lst);
            const proj = projectAltAz(aa.alt, aa.az, radius);
            if (!proj) return;
            ctx.fillStyle = c.color;
            ctx.beginPath(); ctx.arc(cx + proj.x, cy + proj.y, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = printMode ? "#000" : c.color;
            ctx.font = "italic 11px Arial";
            ctx.fillText(c.name, cx + proj.x + 7, cy + proj.y - 6);
        });
    }

    // DRAW ACTIVE ALIGNMENT CONNECTORS ON ASTROLABE
    if (activeAlignments.length) {
        const bodiesNow = getBodies(date).filter(b => b.type !== "earth");
        const byName = {};
        bodiesNow.forEach(b => { byName[b.name] = b; });

        activeAlignments.forEach(ev => {
            if (ev.kind === "conjunction") {
                const a = byName[ev.nameA], b = byName[ev.nameB];
                if (!a || !b) return;
                const aa1 = raDecToAltAz(a.ra, a.dec, lat, lst);
                const aa2 = raDecToAltAz(b.ra, b.dec, lat, lst);
                const p1 = projectAltAz(aa1.alt, aa1.az, radius);
                const p2 = projectAltAz(aa2.alt, aa2.az, radius);
                if (p1 && p2) {
                    ctx.strokeStyle = "#ffe066";
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([5, 4]);
                    ctx.beginPath(); ctx.moveTo(cx + p1.x, cy + p1.y); ctx.lineTo(cx + p2.x, cy + p2.y); ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
        });
    }

    ctx.font = "18px serif"; ctx.fillStyle = printMode ? "#000" : "#D4AF37"; ctx.textAlign = "center";
    ctx.fillText("DIGITAL ASTROLABE", cx, 35);
    statusEl.textContent = "LST: " + lst.toFixed(2) + "° | Visible Stars: " + visibleCount + " / " + stars.length + " | Hover star for name";
}

function drawOrrery(date, isNatal) {
    const bodies = getBodies(date);
    const W = orreryCanvas.width, H = orreryCanvas.height, cx = W / 2, cy = H / 2;
    const auMin = 0.3, auMax = 42, minR = 45, maxR = Math.min(W, H) / 2 - 25;

    function auToPx(au) {
        const clamped = Math.max(auMin, Math.min(au, auMax));
        return minR + ((Math.log(clamped) - Math.log(auMin)) / (Math.log(auMax) - Math.log(auMin))) * (maxR - minR);
    }

    orreryCtx.fillStyle = "#050505"; orreryCtx.fillRect(0, 0, W, H);

    orreryCtx.strokeStyle = "rgba(212, 175, 55, 0.35)";
    orreryCtx.lineWidth = 1;
    planetOrder.concat(["Earth"]).forEach(name => {
        orreryCtx.beginPath();
        orreryCtx.arc(cx, cy, auToPx(planetElements[name].a[0]), 0, Math.PI * 2);
        orreryCtx.stroke();
    });

    orreryCtx.fillStyle = "#FFD700"; orreryCtx.beginPath(); orreryCtx.arc(cx, cy, 8, 0, Math.PI * 2); orreryCtx.fill();

    bodies.filter(b => b.type === "planet" || b.type === "earth").forEach(b => {
        const dist = Math.sqrt(b.helio.x * b.helio.x + b.helio.y * b.helio.y);
        const r = auToPx(dist), angle = Math.atan2(b.helio.y, b.helio.x);
        const x = cx + r * Math.cos(angle), y = cy - r * Math.sin(angle);

        orreryCtx.fillStyle = b.color;
        orreryCtx.beginPath(); orreryCtx.arc(x, y, b.type === "earth" ? 6 : 5, 0, Math.PI * 2); orreryCtx.fill();
        orreryCtx.strokeStyle = "#ffffff"; orreryCtx.lineWidth = 1; orreryCtx.stroke();
        orreryCtx.fillStyle = "#ccc"; orreryCtx.font = "10px Arial"; orreryCtx.fillText(b.name, x + 7, y - 5);
    });

    orreryCtx.fillStyle = "#D4AF37"; orreryCtx.font = "13px serif";
    orreryCtx.fillText(isNatal ? "NATAL SYSTEM (" + date.toISOString().slice(0, 10) + ")" : "LIVE HELIOCENTRIC ORRERY", 12, 20);
}

function buildLegend() {
    const items = [{ name: "Sun", color: "#FFD700" }];
    planetOrder.forEach(name => items.push({ name, color: planetElements[name].color }));
    items.push({ name: "Earth (orrery)", color: "#5b9bd5" });
    comets.forEach(c => items.push({ name: c.name + " (comet)", color: c.color }));
    legendEl.innerHTML = items.map(it => '<span><span class="swatch" style="background:' + it.color + '"></span>' + it.name + '</span>').join('');
}

/* ===================== NATAL INSIGHTS & TIMEZONE LOOKUP ===================== */

function getZonedParts(date, timeZone) {
    const dtf = new Intl.DateTimeFormat('en-US', {
        timeZone, hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    const parts = {};
    dtf.formatToParts(date).forEach(p => { if (p.type !== 'literal') parts[p.type] = p.value; });
    return {
        y: Number(parts.year), m: Number(parts.month), d: Number(parts.day),
        hh: Number(parts.hour === '24' ? '0' : parts.hour), mm: Number(parts.minute)
    };
}

function zonedTimeToUtc(y, m, d, hh, mm, timeZone) {
    let guess = new Date(Date.UTC(y, m - 1, d, hh, mm));
    const target = Date.UTC(y, m - 1, d, hh, mm);
    for (let i = 0; i < 3; i++) {
        const parts = getZonedParts(guess, timeZone);
        const guessAsIfLocal = Date.UTC(parts.y, parts.m - 1, parts.d, parts.hh, parts.mm);
        const diff = target - guessAsIfLocal;
        if (diff === 0) break;
        guess = new Date(guess.getTime() + diff);
    }
    return guess;
}

function generateNatalInsights(sunZ, moonZ, ascZ, bodies) {
    const counts = { Fire: 0, Earth: 0, Air: 0, Water: 0 };
    counts[sunZ.data.element]++; counts[moonZ.data.element]++; counts[ascZ.data.element]++;
    bodies.forEach(b => { if (b.type === "planet") counts[eclipticLonToZodiac(b.eclLon).data.element]++; });

    let domElement = "Fire", maxCount = 0;
    for (const [elem, count] of Object.entries(counts)) {
        if (count > maxCount) { maxCount = count; domElement = elem; }
    }

    const elemDescriptions = {
        Fire: "Your chart is heavily charged with **Fire energy**. You move through life with instinct, enthusiasm, and a creative drive that inspires others.",
        Earth: "Your chart is grounded in strong **Earth energy**. You have an innate practical intelligence, steady focus, and a talent for building lasting results.",
        Air: "Your chart is intellect-driven with **Air energy**. You thrive on ideas, conceptual connections, dynamic conversation, and mental freedom.",
        Water: "Your chart flows with deep **Water energy**. You process life through emotional resonance, keen intuition, and artistic or psychological perception."
    };

    return `
        <div class="natal-insights">
            <h4>✨ Personal Natal Interpretations</h4>

            <div class="insight-card">
                <strong>Core Triad (${sunZ.data.name} Sun / ${moonZ.data.name} Moon / ${ascZ.data.name} Rising)</strong>
                <p>Your vital identity (<strong>Sun in ${sunZ.data.name}</strong>) seeks self-expression by being ${sunZ.data.traits} Meanwhile, your private inner world (<strong>Moon in ${moonZ.data.name}</strong>) finds emotional comfort by being ${moonZ.data.traits} To the outer world, your <strong>${ascZ.data.name} Ascendant</strong> presents a first impression that is ${ascZ.data.traits}</p>
            </div>

            <div class="insight-card">
                <strong>Dominant Element: <span class="element-pill elem-${domElement}">${domElement}</span></strong>
                <p>${elemDescriptions[domElement]}</p>
            </div>

            <div class="insight-card">
                <strong>Chart Ruling Planet: ${ascZ.data.ruler}</strong>
                <p>Because your Ascendant falls in <strong>${ascZ.data.name}</strong>, your chart is governed by <strong>${ascZ.data.ruler}</strong>. This planet serves as the cosmic compass for your personal journey and core drive.</p>
            </div>
        </div>`;
}

function showHoroscope(switchOrrery = true) {
    if (!birthDateInput.value) return;
    const [y, m, d] = birthDateInput.value.split('-').map(Number);
    const [hh, mm] = (birthTimeInput.value || "12:00").split(':').map(Number);
    
    // The Sun moves ~1 degree a day, so its sign survives a time zone error.
    // The Ascendant moves a degree every 4 minutes and does not. When the zone
    // is unknown we show Sun and Moon and withhold the angles rather than
    // printing a confident wrong chart.
    const tzName = birthTimeZoneInput.value.trim();
    let birthDate, tzKnown = false;
    if (tzName) {
        try {
            birthDate = zonedTimeToUtc(y, m, d, hh, mm, tzName);
            tzKnown = true;
            birthTzStatusEl.textContent = "Local civil time in " + tzName + ", converted to UTC.";
            birthTzStatusEl.style.color = "#777";
        } catch(e) {
            birthDate = new Date(Date.UTC(y, m - 1, d, hh, mm));
            birthTzStatusEl.textContent = "That time zone wasn't recognised. Try a name like America/Phoenix.";
            birthTzStatusEl.style.color = "#ff8080";
        }
    } else {
        birthDate = new Date(Date.UTC(y, m - 1, d, hh, mm));
        birthTzStatusEl.textContent = "Set a birth time zone to calculate your rising sign and houses.";
        birthTzStatusEl.style.color = "#ff8080";
    }

    const lat = parseFloat(birthLatInput.value) || 0;
    const lon = parseFloat(birthLonInput.value) || 0;

    const bodies = computeBodies(birthDate);
    const sunBody = bodies.find(b => b.type === "sun");
    const moonLon = moonEclipticLongitude(birthDate);

    const T = centuriesSinceJ2000(birthDate);
    const eps = obliquityOfEcliptic(T);
    const ramc = siderealTime(birthDate, lon);
    const ascendant = tzKnown ? computeAscendant(ramc, lat, eps) : null;
    const midheaven = tzKnown ? computeMidheaven(ramc, eps) : null;
    const houses = tzKnown ? computeEqualHouses(ascendant) : null;

    const sunZ = eclipticLonToZodiac(sunBody.eclLon);
    const moonZ = eclipticLonToZodiac(moonLon);
    const ascZ = tzKnown ? eclipticLonToZodiac(ascendant) : null;

    const chartBodies = bodies.filter(b => b.type === "sun" || b.type === "planet").map(b => ({ name: b.name, lon: b.eclLon, color: b.color }));
    chartBodies.push({ name: "Moon", lon: moonLon, color: "#e8e8e8" });

    const insightsHTML = tzKnown
        ? generateNatalInsights(sunZ, moonZ, ascZ, bodies)
        : '<div class="natal-insights"><h4>Rising sign unavailable</h4>' +
          '<div class="insight-card"><strong>Your birth time zone is needed</strong>' +
          '<p>Your Sun and Moon signs are shown above and are reliable. The Ascendant ' +
          'moves a full degree every four minutes, so it cannot be calculated without ' +
          'knowing the time zone of your birthplace. Search for your birth city above ' +
          'and the time zone will fill in automatically.</p></div></div>';

    horoscopeResultEl.innerHTML = `
        <div class="horoSummary">
            <div class="horoSign">
                <span class="horoSymbol">${sunZ.data.symbol}</span>
                <div>
                    <strong>${sunZ.data.name} Sun</strong><br>
                    ${sunZ.degInSign.toFixed(1)}° into ${sunZ.data.name} &middot; Element: ${sunZ.data.element}
                </div>
            </div>
            <div class="horoSign">
                <span class="horoSymbol">${moonZ.data.symbol}</span>
                <div>
                    <strong>${moonZ.data.name} Moon</strong><br>
                    ${moonZ.degInSign.toFixed(1)}° into ${moonZ.data.name} &middot; Element: ${moonZ.data.element}
                </div>
            </div>
            ${tzKnown ? `
            <div class="horoSign">
                <span class="horoSymbol" style="color:#ff6b6b;">${ascZ.data.symbol}</span>
                <div>
                    <strong>${ascZ.data.name} Ascendant</strong><br>
                    ${ascZ.degInSign.toFixed(1)}° into ${ascZ.data.name} &middot; Rising
                </div>
            </div>` : `
            <div class="horoSign">
                <span class="horoSymbol" style="color:#666;">?</span>
                <div>
                    <strong>Ascendant unknown</strong><br>
                    <span style="color:#999;">Needs a birth time zone</span>
                </div>
            </div>`}
        </div>
        ${insightsHTML}`;

    drawZodiacWheel(chartBodies, sunZ.idx, houses, ascendant, midheaven);
    requestRender();
    if (switchOrrery) orreryViewDate = birthDate;
}

/* ===================== GEOCODING & HOVER LISTENERS ===================== */

async function geocodeSearch(query, resultsEl, onPick) {
    const q = (query || "").trim();
    if (q.length < 2) { resultsEl.style.display = "none"; return; }
    resultsEl.innerHTML = '<div class="locResultItem" style="color:#777;">Searching...</div>';
    resultsEl.style.display = "block";

    try {
        // Open-Meteo returns the IANA timezone alongside the coordinates, so one
        // call replaces the old Nominatim + GeoNames pair.
        const url = "https://geocoding-api.open-meteo.com/v1/search?count=5&language=en&format=json&name=" + encodeURIComponent(q);
        const res = await fetch(url);
        const payload = await res.json();
        const data = payload.results || [];
        if (!data.length) {
            resultsEl.innerHTML = '<div class="locResultItem" style="color:#777;">No matches found.</div>';
            return;
        }
        resultsEl.innerHTML = data.map((d, i) => {
            const label = [d.name, d.admin1, d.country].filter(Boolean).join(', ');
            return `<div class="locResultItem" data-idx="${i}">${label}</div>`;
        }).join('');
        Array.from(resultsEl.querySelectorAll('.locResultItem[data-idx]')).forEach(el => {
            el.addEventListener('click', () => {
                const picked = data[Number(el.getAttribute('data-idx'))];
                onPick(parseFloat(picked.latitude), parseFloat(picked.longitude), picked.timezone || null);
                resultsEl.style.display = "none";
            });
        });
    } catch (e) {
        resultsEl.innerHTML = '<div class="locResultItem" style="color:#ff8080;">Search failed. Enter coordinates manually.</div>';
    }
}

geoBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {

        err => {

                1: "Location permission was blocked. Use the search box above, or type your coordinates in directly.",

                3: "The location request timed out. Try again, or use the search box."

            geoStatusEl.textContent = messages[err.code] || "Couldn't get your location — enter coordinates manually.";
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
    );
});

function updateStarTooltip(clientX, clientY, screenRadius) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (clientX - rect.left) * scaleX;
    const my = (clientY - rect.top) * scaleY;

    // Hit radius is specified in CSS pixels and converted to canvas units, so
    // a fingertip gets a usable target even when 1000px is squeezed onto a phone.
    let nearest = null, nearestDist = (screenRadius || 10) * scaleX;
    starScreenPositions.forEach(s => {
        const dx = s.x - mx, dy = s.y - my;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < nearestDist) { nearestDist = dist; nearest = s; }
    });

    if (nearest) {
        starTooltipEl.textContent = nearest.con ? (nearest.name + " — " + nearest.con) : nearest.name;
        starTooltipEl.style.display = "block";
        const wrapRect = astrolabeWrapEl.getBoundingClientRect();
        starTooltipEl.style.left = (clientX - wrapRect.left + 12) + "px";
        starTooltipEl.style.top = (clientY - wrapRect.top + 12) + "px";
    } else {
        starTooltipEl.style.display = "none";
    }
}

canvas.addEventListener('mousemove', e => updateStarTooltip(e.clientX, e.clientY, 10));
canvas.addEventListener('mouseleave', () => { starTooltipEl.style.display = "none"; });

// Touch: mousemove never fires on a phone, so bind the same lookup to touch
// with a finger-sized hit radius. Listeners are passive so pinch-zoom still works.
let touchHideTimer = null;
function handleCanvasTouch(e) {
    if (!e.touches || !e.touches.length) return;
    clearTimeout(touchHideTimer);
    updateStarTooltip(e.touches[0].clientX, e.touches[0].clientY, 24);
}
canvas.addEventListener('touchstart', handleCanvasTouch, { passive: true });
canvas.addEventListener('touchmove', handleCanvasTouch, { passive: true });
canvas.addEventListener('touchend', () => {
    touchHideTimer = setTimeout(() => { starTooltipEl.style.display = "none"; }, 2500);
}, { passive: true });

    link.href = canvasEl.toDataURL('image/png');

}

/* ===================== CONTROL LISTENERS & MAIN LOOP ===================== */

dtInput.value = toUTCInputValue(new Date());
liveCheckbox.addEventListener('change', () => {
    dtInput.disabled = liveCheckbox.checked;
    if (liveCheckbox.checked) startLiveTicker(); else stopLiveTicker();
    refreshAlignments();
});

showHoroscopeBtn.addEventListener('click', () => showHoroscope(true));
birthDateInput.addEventListener('change', () => showHoroscope(true));
birthTimeInput.addEventListener('change', () => showHoroscope(true));

liveOrreryBtn.addEventListener('click', () => {
    orreryViewDate = null;
    requestRender();
});

refreshAlignBtn.addEventListener('click', refreshAlignments);

function getCurrentDate() { return liveCheckbox.checked ? new Date() : parseAsUTC(dtInput.value); }

// The sky moves ~0.004 degrees per animation frame, so redrawing at 60fps
// burned battery to produce identical images. Render on demand instead, plus a
// slow tick while live, paused whenever the app is backgrounded.
let _renderQueued = false;

function render() {
    _renderQueued = false;
    const date = getCurrentDate();
    drawAstrolabe(date);
    drawOrrery(orreryViewDate || date, !!orreryViewDate);
}

function requestRender() {
    if (_renderQueued) return;
    _renderQueued = true;
    requestAnimationFrame(render);
}

let _liveTimer = null;
function startLiveTicker() {
    stopLiveTicker();
    _liveTimer = setInterval(() => {
        if (document.visibilityState === 'visible') requestRender();
    }, 1000);
}
function stopLiveTicker() {
    if (_liveTimer) { clearInterval(_liveTimer); _liveTimer = null; }
}

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { requestRender(); startLiveTicker(); }
    else { stopLiveTicker(); }
});

// Any control that changes what's drawn should trigger a redraw.
[showStars, showConstellations, showEcliptic, showPlanets, showComets].forEach(el => {
    el.addEventListener('change', requestRender);
});
[latInput, lonInput, dtInput].forEach(el => {
    el.addEventListener('input', requestRender);
    el.addEventListener('change', requestRender);
});
window.addEventListener('resize', requestRender);

// Initial setup defaults
birthDateInput.value = new Date().toISOString().slice(0, 10);
birthLatInput.value = latInput.value;
birthLonInput.value = lonInput.value;

dtInput.disabled = liveCheckbox.checked;
render();
startLiveTicker();
refreshAlignments();

/* ===================== SERVICE WORKER ===================== */
// Registered last so a failure here can never stop the app from running.
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js').catch(err => {
            console.warn('Service worker registration failed:', err);
        });
    });
}
