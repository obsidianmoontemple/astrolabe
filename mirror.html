<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel&display=swap');

  html { background: #0b0616; min-height: 100%; }

  body {
    margin: 0; padding: 0;
    min-height: 100vh;
    min-height: 100dvh;
    /* Dark base only. The scene image now lives in its own element below, so
       the reflection box can sit under the mirror instead of on top of it. */
    background: radial-gradient(circle at 50% 22%, #16102b 0%, #0b0616 60%, #070410 100%);
    font-family: 'Cinzel', serif;
    overflow-x: hidden;
    color: #e8e2f6;
  }

  .stage {
    max-width: 760px;
    margin: 0 auto;
    padding: 62px 16px calc(36px + env(safe-area-inset-bottom, 0px));
  }

  .scene {
    width: 100%;
    aspect-ratio: 1408 / 768;
    border-radius: 14px;
    border: 1px solid #3a2a58;
    background-color: #0b0616;
    background-image: url('mirror-bg.jpg');
    background-image: -webkit-image-set(url('mirror-bg.webp') 1x);
    background-image: image-set(url('mirror-bg.webp') type('image/webp'),
                                url('mirror-bg.jpg')  type('image/jpeg'));
    background-size: cover;
    background-position: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.55);
  }

  @media (max-width: 820px) {
    .scene {
      background-image: url('mirror-bg-800.jpg');
      background-image: image-set(url('mirror-bg-800.webp') type('image/webp'),
                                  url('mirror-bg-800.jpg')  type('image/jpeg'));
    }
  }

  .container {
    text-align: center;
    background: rgba(8, 4, 18, 0.72);
    padding: 22px 20px;
    border-radius: 16px;
    border: 1px solid #4a306d;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    max-width: 560px;
    margin: 18px auto 0;
  }

  #mirror-text {
    font-size: 1.5rem; font-style: italic;
    color: transparent;
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    transition: opacity 3s ease-in;
    min-height: 3.2em; max-width: 100%;
  }

  button {
    background: rgba(42, 26, 74, 0.8); color: #c0a0ff;
    border: 1px solid #7040b0; padding: 12px 30px;
    cursor: pointer; text-transform: uppercase;
    letter-spacing: 2px; transition: 0.3s;
    margin-top: 20px;
  }

  button:hover { background: #402070; box-shadow: 0 0 15px #7040b0; }

  button:focus-visible { outline: 2px solid #c0a0ff; outline-offset: 3px; }

  /* Hidden Reset Trigger */
  #reset-btn { position: fixed;
    position: fixed; bottom: 5px; right: 5px;
    width: 20px; height: 20px;
    background: transparent; border: none; cursor: pointer;
  }

  .starburst {
    position: absolute; color: #fff; font-size: 30px;
    text-shadow: 0 0 10px #ff0, 0 0 20px #ff0;
    pointer-events: none; z-index: 10;
    animation: burst 1.5s ease-out forwards;
  }

  @keyframes burst {
    0% { transform: scale(0) rotate(0deg); opacity: 1; }
    100% { transform: scale(3) rotate(180deg); opacity: 0; }
  }

</style>
<meta name="theme-color" content="#07060a">
<link rel="manifest" href="manifest.json">

<style>
/* ==== mobile hardening (added for the Temple app build) ==== */
html { -webkit-text-size-adjust: 100%; }

/* nothing should ever force a sideways scroll on a phone */
body { overflow-x: hidden; }
img, canvas, svg, video, iframe { max-width: 100%; }

/* kill the 300ms double-tap delay and give fingers a real target */
button, [role="button"], a.btn, .nav-btn, .action-btn, .culture-btn, .chap-btn {
  touch-action: manipulation;
}
@media (pointer: coarse) and (max-width: 600px) {
  button, [role="button"], .nav-btn, .action-btn { min-height: 44px; }
}

/* respect the system setting - also saves battery on the particle canvases */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* offline notice - shown only when the device actually drops connection */
#omtOfflineBar {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 99999;
  background: #2a1d00; color: #ffe2a8;
  border-top: 1px solid #ffcc66;
  font: 500 13px/1.4 system-ui, sans-serif;
  text-align: center; padding: 10px 14px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
}
body.omt-offline #omtOfflineBar { display: block; }
</style>
</head>
<body>

  <div class="stage">
    <div class="scene" role="img" aria-label="The Obsidian Mirror in a moonlit wood"></div>
    <div class="container">
    <div id="mirror-text">Consult the Obsidian Moon...</div>
      <button id="btn" onclick="reveal()">Seek Reflection</button>
    </div>
  </div>

  <!-- Hidden Reset Button -->
  <button id="reset-btn" onclick="resetMirror()" title="Admin Reset" aria-label="Admin Reset"></button>

  <script>
    const reflections = [
      "The darkness reveals what the light hides.",
      "A path is only as clear as the shadow it casts.",
      "The Old Gods look upon your intent.",
      "You are the magic you seek.",
      "Balance is found in the heart of the storm.",
      "The mirror reflects the future you are forging.",
      "What you resist quietly shapes you the most.",
      "Patience is a spell that always works.",
      "The question you keep avoiding holds your answer.",
      "Small, honest steps outpace grand, hollow ones.",
      "Not every door needs to be opened today.",
      "The quiet voice is usually the true one.",
      "What you water will grow, choose carefully.",
      "Your instincts already know, your fear is just louder.",
      "Rest is not the opposite of progress.",
      "The version of you from a year ago would be proud.",
      "Let go of what was never truly yours to carry.",
      "A single honest word outweighs a hundred careful ones.",
      "The storm you fear may be the one that clears the air.",
      "You are allowed to outgrow what once fit you.",
      "The mirror does not lie, but it does wait for courage.",
      "Somewhere, a decision you made has already begun to bloom.",
      "What feels like delay may simply be preparation.",
      "The company you keep is a mirror of its own.",
      "Today asks for presence, not perfection.",
      "The thing you keep postponing is ready when you are.",
      "Old wounds soften when finally spoken aloud.",
      "You do not need permission to change your mind.",
      "The path behind you was never wasted.",
      "Trust the timing, even when it tests you."
    ];

    const STORAGE_KEY = 'lastUsed';

    function todayString() {
      return new Date().toDateString();
    }

    // Uses Claude's artifact storage when this runs inside a Claude preview,
    // and falls back to plain localStorage anywhere else (e.g. your live site).
    async function storageGet(key) {
      if (typeof window.storage !== 'undefined') {
        try {
          const result = await window.storage.get(key);
          return result ? result.value : null;
        } catch (e) {
          return null;
        }
      }
      try {
        return localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }

    async function storageSet(key, value) {
      if (typeof window.storage !== 'undefined') {
        try {
          await window.storage.set(key, value);
          return;
        } catch (e) {
          console.error('Could not save to artifact storage:', e);
        }
      }
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        console.error('Could not save to localStorage:', e);
      }
    }

    async function storageDelete(key) {
      if (typeof window.storage !== 'undefined') {
        try {
          await window.storage.delete(key);
          return;
        } catch (e) {
          console.error('Could not clear artifact storage:', e);
        }
      }
      try {
        localStorage.removeItem(key);
      } catch (e) {
        console.error('Could not clear localStorage:', e);
      }
    }

    function showLockedMessage() {
      document.getElementById('mirror-text').innerText = "The mirror has already revealed your truth for today.";
      document.getElementById('mirror-text').style.opacity = "1";
      document.getElementById('btn').style.display = 'none';
    }

    async function checkLock() {
      const stored = await storageGet(STORAGE_KEY);
      if (stored === todayString()) {
        showLockedMessage();
        return true;
      }
      return false;
    }

    async function reveal() {
      const alreadyUsed = await checkLock();
      if (alreadyUsed) return;

      const text = document.getElementById('mirror-text');
      text.innerText = reflections[Math.floor(Math.random() * reflections.length)];
      text.style.opacity = "1";
      document.getElementById('btn').style.display = 'none';

      for(let i=0; i<8; i++) {
        let star = document.createElement('div');
        star.innerHTML = "✧";
        star.className = 'starburst';
        star.style.left = (45 + Math.random() * 10) + "%";
        star.style.top = (45 + Math.random() * 10) + "%";
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 1500);
      }

      await storageSet(STORAGE_KEY, todayString());
    }

    // Check the lock as soon as the page loads, not just on click
    checkLock();

    // Change this to any passcode you want — this is the only thing
    // standing between a curious visitor and the reset button, so
    // pick something only you'd know, then keep this file private.
    const ADMIN_PASSCODE = "obsidian2023";

    // Function to clear the date and allow a new consultation
    async function resetMirror() {
      const entered = prompt("Enter the admin passcode to reset the mirror:");
      if (entered === null) return;
      if (entered !== ADMIN_PASSCODE) {
        alert("Incorrect passcode.");
        return;
      }

      await storageDelete(STORAGE_KEY);
      alert("Mirror reset for the next seeker.");
      location.reload();
    }
  </script>

<script>
/* ==== mobile hardening (added for the Temple app build) ==== */
(function () {
  // 1. Hold animation frames while the app is backgrounded, then resume.
  //    Without this the particle loops keep requesting frames in standalone
  //    mode and quietly drain the battery.
  if (window.requestAnimationFrame) {
    var native = window.requestAnimationFrame.bind(window);
    var held = new Set();
    window.requestAnimationFrame = function (cb) {
      if (document.hidden) { held.add(cb); return -1; }
      return native(cb);
    };
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && held.size) {
        var queued = Array.from(held);
        held.clear();
        queued.forEach(function (cb) { native(cb); });
      }
    });
  }

  // 2. Tell the user when they're offline, so a failed save reads as
  //    "no signal" rather than "this app is broken".
  function ensureBar() {
    if (document.getElementById('omtOfflineBar')) return;
    var bar = document.createElement('div');
    bar.id = 'omtOfflineBar';
    bar.textContent = "You're offline \u2014 anything you send will need a connection. Everything else keeps working.";
    document.body.appendChild(bar);
  }
  function sync() {
    ensureBar();
    document.body.classList.toggle('omt-offline', !navigator.onLine);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sync);
  } else { sync(); }
  window.addEventListener('online', sync);
  window.addEventListener('offline', sync);
})();
</script>

<style>
#templeBack{
  position:fixed; z-index:99998;
  top:calc(10px + env(safe-area-inset-top,0px));
  left:calc(10px + env(safe-area-inset-left,0px));
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px 8px 10px; min-height:38px;
  background:rgba(10,6,24,.82); color:#c092f0;
  border:1px solid rgba(157,91,210,.42); border-radius:999px;
  font:500 12.5px/1 system-ui,-apple-system,sans-serif;
  letter-spacing:.04em; text-decoration:none;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  transition:background .2s,border-color .2s;
}
#templeBack:hover,#templeBack:focus-visible{background:rgba(20,12,40,.95);border-color:#9d5bd2;outline:none}
#templeBack:active{transform:scale(.96)}
#templeBack svg{width:13px;height:13px;flex:none}
@media print{#templeBack{display:none}}
</style>
<a id="templeBack" href="index.html" aria-label="Back to the Temple">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
       stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  Temple
</a>
</body>
</html>
